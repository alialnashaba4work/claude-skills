<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>السيد أحمد الموسوي</title>
  <meta name="theme-color" content="#070c24">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="img/icon-192.png">
  <link rel="icon" href="img/icon-192.png">
  <link rel="preload" href="fonts/AbarMid-black.otf" as="font" type="font/otf" crossorigin>
  <script>try{if(sessionStorage.getItem("theme")==="light")document.documentElement.dataset.theme="light"}catch(e){}</script>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="yt.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/" id="brand"></a>
    <button class="icon-btn" id="fsBtn" type="button" aria-label="ملء الشاشة" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
  </header>

  <main id="view" tabindex="-1"></main>

  <!-- مشغل صغير ثابت أسفل الشاشة -->
  <div class="mini" id="mini" hidden>
    <button class="mini-play" id="miniPlay" type="button" aria-label="تشغيل"></button>
    <a class="mini-info" id="miniInfo" href="#/">
      <span class="mini-title" id="miniTitle"></span>
      <span class="mini-sub" id="miniSub"></span>
    </a>
    <div class="mini-bar"><span id="miniProg"></span></div>
  </div>

  <audio id="audio" preload="metadata" playsinline></audio>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="data.js"></script>
  <script src="yt-data.js"></script>
  <script src="app.js"></script>
  <script src="yt.js"></script>
</body>
</html>
