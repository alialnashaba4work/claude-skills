<title>Freelance &amp; More Media</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Thmanyah Sans files are published with the private artifact only (licensed, never committed to this repo). */
@font-face{font-family:"Thmanyah Sans";font-weight:300 400;font-display:swap;src:local("Thmanyah Sans"),url("fonts/ThmanyahSans-Regular.otf") format("opentype")}
@font-face{font-family:"Thmanyah Sans";font-weight:500 600;font-display:swap;src:url("fonts/ThmanyahSans-Medium.otf") format("opentype")}
@font-face{font-family:"Thmanyah Sans";font-weight:700 800;font-display:swap;src:url("fonts/ThmanyahSans-Bold.otf") format("opentype")}
/* Layout: one rounded app panel; top bar with workspace switch, a stat row, then a 4-column status board. Card opens a side panel. */
:root{
  --bg:#ECEFEE; --panel:#F6F7F7; --surface:#FFFFFF; --surface-2:#F1F3F3; --line:#E2E6E5;
  --ink:#383838; --ink-2:#6E7372; --ink-3:#9AA09F;
  --accent:#0EA89C; --accent-soft:#E2F4F2; --on-accent:#FFFFFF;
  --solid:#383838; --on-solid:#FFFFFF;
  --warn:#B97E00; --warn-soft:#FBF1D9; --danger:#C8423E; --danger-soft:#FBE6E5;
  --shadow:0 1px 2px rgba(56,56,56,.05),0 8px 24px rgba(56,56,56,.06);
  /* Montserrat first: it has no Arabic glyphs, so Latin text and digits use it and Arabic falls through to Thmanyah Sans (installed on the device), then IBM Plex Sans Arabic */
  --f-display:"Montserrat","Thmanyah Sans","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"Montserrat","Thmanyah Sans","IBM Plex Sans Arabic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#262626; --panel:#2E2E2E; --surface:#383838; --surface-2:#414141; --line:#4A4A4A;
  --ink:#F3F4F4; --ink-2:#B3B8B7; --ink-3:#8A908F;
  --accent:#12B3A6; --accent-soft:#1F4A46; --on-accent:#FFFFFF;
  --solid:#FFFFFF; --on-solid:#383838;
  --warn:#F0BC4A; --warn-soft:#4A3E22; --danger:#F07B76; --danger-soft:#4D2B2A;
  --shadow:0 1px 2px rgba(0,0,0,.2),0 8px 24px rgba(0,0,0,.18); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#262626; --panel:#2E2E2E; --surface:#383838; --surface-2:#414141; --line:#4A4A4A;
  --ink:#F3F4F4; --ink-2:#B3B8B7; --ink-3:#8A908F;
  --accent:#12B3A6; --accent-soft:#1F4A46; --on-accent:#FFFFFF;
  --solid:#FFFFFF; --on-solid:#383838;
  --warn:#F0BC4A; --warn-soft:#4A3E22; --danger:#F07B76; --danger-soft:#4D2B2A;
  --shadow:0 1px 2px rgba(0,0,0,.2),0 8px 24px rgba(0,0,0,.18); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:1320px;margin-inline:auto;background:var(--panel);border-radius:28px;padding:20px;display:flex;flex-direction:column;gap:22px}

/* top bar */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:999px;padding:6px 16px 6px 6px;font-family:var(--f-display);font-weight:600}
.brand svg{width:34px;height:34px;flex:none}
.switch{display:flex;gap:4px;background:var(--surface);border-radius:999px;padding:5px;margin-inline:auto}
.switch button{border:0;background:transparent;border-radius:999px;padding:9px 20px;color:var(--ink-2);font-weight:500;display:flex;gap:8px;align-items:center;font-family:var(--f-display)}
.switch button[aria-pressed="true"]{background:var(--solid);color:var(--on-solid)}
.switch .n{font-size:12px;min-width:22px;padding:0 6px;border-radius:999px;background:var(--surface-2);color:var(--ink-2)}
.switch button[aria-pressed="true"] .n{background:var(--accent);color:var(--on-accent)}
.theme{display:flex;gap:2px;background:var(--surface);border-radius:999px;padding:4px}
.theme button{width:36px;height:36px;border:0;border-radius:50%;background:transparent;color:var(--ink-2);display:grid;place-items:center;transition:background .2s,color .2s}
.theme button[aria-pressed="true"]{background:var(--solid);color:var(--on-solid)}
.theme svg{width:18px;height:18px}
.btn{border:0;border-radius:999px;padding:10px 18px;font-weight:500;display:inline-flex;align-items:center;gap:8px}
.btn-solid{background:var(--solid);color:var(--on-solid)}
.btn-accent{background:var(--accent);color:var(--on-accent)}
.btn-ghost{background:var(--surface-2);color:var(--ink)}
.btn svg{width:16px;height:16px}

/* greeting */
.hello{display:flex;align-items:flex-end;align-content:flex-end;gap:16px;flex-wrap:wrap}
.hello-t{flex:1 1 320px;min-width:0}
.streak{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:22px;padding:8px 8px 8px 18px;flex:0 1 auto}
.plant{width:104px;height:64px;border-radius:16px;background:var(--accent-soft);flex:none;display:grid;place-items:center;overflow:hidden}
.plant svg{width:64px;height:64px;transform-origin:50% 90%}
.plant.grow svg{animation:grow .9s cubic-bezier(.3,1.6,.5,1)}
@keyframes grow{0%{transform:scale(.6)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.st-l{font-size:12px;color:var(--ink-2)}
.st-n{font-family:var(--f-display);font-size:22px;font-weight:600;line-height:1.2;font-variant-numeric:tabular-nums}
.st-s{font-size:12px;color:var(--ink-3)}
.st-s b{font-weight:600;color:var(--accent)}
.st-s .wait{color:var(--warn)}
.hello h1{font-family:var(--f-display);font-weight:500;font-size:clamp(24px,3.4vw,34px);margin:0;letter-spacing:-.01em;text-wrap:balance}
.hello p{margin:4px 0 0;color:var(--ink-2)}
.status-note{font-size:12px;color:var(--ink-3)}

/* stats */
.stats{display:flex;flex-wrap:wrap;gap:10px}
.stat{background:var(--surface);border-radius:16px;padding:10px 16px 10px 18px;display:grid;grid-template-columns:auto auto;grid-template-areas:"num lbl" "num sub";column-gap:12px;row-gap:1px;align-items:center;flex:0 0 auto}
.stat.hl{background:linear-gradient(160deg,#16BDB0,#0A9488);color:#fff}
.stat .lbl{grid-area:lbl;display:flex;align-items:center;color:var(--ink-2);font-size:13px;font-weight:500}
.stat.hl .lbl{color:rgba(255,255,255,.9)}
.stat .ico{display:none}
.stat.hl .ico{display:none}
.stat .ico svg{width:15px;height:15px}
.stat .num{grid-area:num;font-family:var(--f-display);font-size:28px;font-weight:500;line-height:1;font-variant-numeric:tabular-nums;min-width:1ch;text-align:center}
.stat .sub{grid-area:sub;font-size:11.5px;color:var(--ink-3)}
.stat.hl .sub{color:rgba(255,255,255,.8)}

/* toolbar */
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar h2{font-family:var(--f-display);font-weight:500;font-size:20px;margin:0 0 0 auto}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 14px;height:40px;min-width:0;flex:0 1 240px}
.search input{border:0;background:transparent;outline:0;width:100%;min-width:0}
.search svg{width:16px;height:16px;color:var(--ink-3);flex:none}
.select{background:var(--surface);border:1px solid var(--line);border-radius:999px;height:40px;padding:0 14px}

/* board */
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:12px;align-items:start}
.done-toggle{align-self:flex-start;border:0;background:var(--surface);border-radius:999px;padding:9px 16px;display:inline-flex;gap:8px;align-items:center;color:var(--ink-2);font-weight:500}
.done-toggle .n{font-size:12px;min-width:22px;padding:0 6px;border-radius:999px;background:var(--surface-2);text-align:center}
.done-toggle svg{width:14px;height:14px;transition:transform .2s}
.done-toggle[aria-expanded="true"] svg{transform:rotate(180deg)}
.card{background:var(--surface);border:1px solid transparent;border-radius:18px;padding:14px 16px;text-align:start;display:flex;flex-direction:column;gap:8px;width:100%;cursor:pointer}
.card:hover{border-color:var(--line);box-shadow:var(--shadow)}
.card.done{background:transparent;border-color:var(--line)}
.card-foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.done-btn{margin-inline-start:auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:12.5px;display:inline-flex;gap:6px;align-items:center;color:var(--ink-2)}
.done-btn:hover{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.done-btn svg{width:14px;height:14px}
.card.drop-over{outline:2px dashed #0EA89C;outline-offset:2px;background:var(--accent-soft)}
.card.leaving{opacity:0;transform:scale(.97);transition:opacity .25s,transform .25s}
.card .t{font-weight:600;font-size:14px;line-height:1.4;overflow-wrap:anywhere}
.card.done .t{color:var(--ink-3);text-decoration:line-through}
.card .client{color:var(--ink-2);font-size:12.5px;display:flex;align-items:center;gap:6px;min-width:0}
.card .client span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.types{display:flex;flex-wrap:wrap;gap:6px}
.types button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:13px;color:var(--ink-2)}
.types button:hover{border-color:var(--ink-3)}
.types button[aria-pressed="true"]{background:var(--solid);color:var(--on-solid);border-color:var(--solid)}
/* each work type has its own calm color (--c), tinted against the theme */
.chip.kind{--c:#9A9A9A;background:color-mix(in srgb,var(--c) 18%,var(--surface));color:color-mix(in srgb,var(--c) 72%,var(--ink));font-weight:600}
.types button.tc{border-color:color-mix(in srgb,var(--c) 35%,transparent);background:color-mix(in srgb,var(--c) 10%,var(--surface));color:color-mix(in srgb,var(--c) 70%,var(--ink))}
.types button.tc:hover{border-color:var(--c)}
.types button.tc[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}
.chip{font-size:11.5px;border-radius:999px;padding:2px 9px;background:var(--surface-2);color:var(--ink-2);display:inline-flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
.chip.late{background:var(--danger-soft);color:var(--danger)}
.chip.soon{background:var(--warn-soft);color:var(--warn)}
.chip.size-big{background:var(--warn-soft);color:var(--warn)}
.chip.size-med{background:var(--surface-2);color:var(--ink-2)}
.chip.size-easy{background:var(--accent-soft);color:var(--accent)}
.chip.pr-high{background:var(--danger-soft);color:var(--danger)}
.chip.pr-med{background:var(--warn-soft);color:var(--warn)}
.chip.ok{background:var(--accent-soft);color:var(--accent)}
.prog{height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent)}
.empty{grid-column:1/-1;border:1.5px dashed var(--line);border-radius:16px;padding:16px;text-align:center;color:var(--ink-3);font-size:12.5px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(30,30,30,.35);z-index:20}
.drawer{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:min(820px,calc(100% - 48px));height:min(860px,calc(100% - 48px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)));background:var(--surface);z-index:21;display:flex;flex-direction:column;border-radius:28px;overflow:hidden;box-shadow:0 24px 80px rgba(20,20,20,.28);animation:pop .22s ease-out}
@keyframes pop{from{opacity:0;transform:translate(-50%,-48%) scale(.97)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.scrim{backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.drawer .d-body{padding:24px 32px 32px;gap:18px}
.drawer .d-head,.drawer .d-foot{padding-inline:32px}
.drawer .d-title{font-size:30px}
.d-head{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.d-head .ws{font-size:12px;color:var(--ink-2);background:var(--surface-2);border-radius:999px;padding:4px 12px}
.d-head .saved{font-size:12px;color:var(--ink-3);margin-inline-start:auto}
.icon-btn{width:36px;height:36px;border-radius:50%;border:0;background:var(--surface-2);display:grid;place-items:center}
.icon-btn svg{width:16px;height:16px}
.d-body{flex:1;overflow-y:auto;padding:18px 20px 28px;display:flex;flex-direction:column;gap:16px}
.d-title{border:0;background:transparent;font-family:var(--f-display);font-size:22px;font-weight:500;width:100%;outline:0;padding:0}
.d-title::placeholder{color:var(--ink-3)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.sec-l{font-size:12px;color:var(--ink-2);font-weight:500;letter-spacing:.01em}
.field input,.field select,.field textarea{background:var(--surface-2);border:1px solid transparent;border-radius:12px;padding:10px 12px;width:100%;min-width:0}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);outline:0;background:var(--surface)}
.field textarea{min-height:140px;resize:vertical;line-height:1.7}
.seg{display:flex;gap:4px;background:var(--surface-2);border-radius:12px;padding:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:7px 4px;font-size:13px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);font-weight:600}
.checks{display:flex;flex-direction:column;gap:6px}
.chk{display:flex;align-items:center;gap:10px;background:var(--surface-2);border-radius:12px;padding:8px 10px}
.chk input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);flex:none}
.chk input[type=text]{border:0;background:transparent;flex:1;min-width:0;outline:0}
.chk.done input[type=text]{text-decoration:line-through;color:var(--ink-3)}
.chk .x{border:0;background:transparent;color:var(--ink-3);width:24px;height:24px;border-radius:50%}
.add-chk{display:flex;gap:8px}
.add-chk input{flex:1;min-width:0;background:var(--surface-2);border:1px solid transparent;border-radius:12px;padding:9px 12px}
.d-foot{display:flex;gap:10px;align-items:center;padding:14px 20px;border-top:1px solid var(--line)}
.btn-danger{background:var(--danger-soft);color:var(--danger)}
.d-foot .meta{font-size:12px;color:var(--ink-3);margin-inline-start:auto}

.atts{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.atts:empty{display:none}
.att{position:relative;border-radius:12px;overflow:hidden;background:var(--surface-2);aspect-ratio:1;max-width:100%}
.att a{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:var(--ink-2);font-size:11.5px}
.att img,.att video{width:100%;height:100%;object-fit:cover;display:block}
.att .ext{font-family:var(--f-display);font-weight:700;font-size:15px;color:var(--ink)}
.att .nm{padding:0 8px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.att .rm{position:absolute;top:6px;inset-inline-end:6px;border:0;border-radius:999px;background:rgba(40,40,40,.78);color:#fff;font-size:11.5px;padding:0 8px;min-width:24px;height:24px}
.att .rm.armed{background:var(--danger)}
.att.uploading a{color:var(--ink-3)}
.drop{display:flex;flex-direction:column;align-items:center;gap:4px;border:1.5px dashed var(--line);border-radius:14px;padding:16px;text-align:center;color:var(--ink-2);cursor:pointer}
.drop svg{width:20px;height:20px;color:var(--accent)}
.drop:hover,.drawer.over .drop{border-color:var(--accent);background:var(--accent-soft)}
.drop small{color:var(--ink-3);font-size:12px}
.client-row{display:flex;gap:8px}
.client-row select{flex:1;min-width:0}
.client-row .btn{padding:8px 14px;font-size:13px;flex:none}
.auto-note{font-size:12.5px;color:var(--accent)}
.types .x-edit{border-style:dashed}
.types button .del{margin-inline-start:6px;color:var(--danger);font-weight:700}
.att-note{font-size:12.5px;color:var(--danger)}
.att-off{font-size:12.5px;color:var(--ink-3)}
.card .cover{margin:-14px -16px 2px;height:130px;border-radius:17px 17px 0 0;overflow:hidden;background:var(--surface-2)}
.card .cover img{width:100%;height:100%;object-fit:cover;display:block}
.hello{position:relative;overflow:hidden;border-radius:26px;padding:22px 24px;background:var(--sky,var(--surface));min-height:290px;transition:background .6s}
.hello>*:not(.sky-deco){position:relative;z-index:1}
.hello h1,.hello p{color:var(--sky-ink,var(--ink))}
.hello p{opacity:.85}
.hello .status-note{color:inherit;opacity:.75}
.hello .quote{font-size:clamp(15px,1.6vw,18px);font-weight:500;line-height:1.6;max-width:30ch;transition:opacity .5s}
/* the motivational line sits in a small box over the garden */
.hello .hello-t{flex:0 1 auto;margin-inline-end:auto;background:color-mix(in srgb,var(--surface) 88%,transparent);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border-radius:16px;padding:10px 16px;box-shadow:0 2px 10px rgba(30,30,30,.08)}
.hello .hello-t h1,.hello .hello-t p{color:var(--ink)}
.sky-deco::after{display:none}
/* no motivational line: the banner is just the garden */
.hello .hello-t{display:none}
/* small garden card, bottom-left */
.hello .streak{margin-inline-start:auto;padding:5px;gap:6px;border-radius:16px;background:color-mix(in srgb,var(--surface) 45%,transparent);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);border:1px solid color-mix(in srgb,var(--surface) 60%,transparent)}
.hello .streak .plant{background:color-mix(in srgb,var(--accent-soft) 55%,transparent)}
.hello .streak .garden-btn{background:color-mix(in srgb,var(--accent-soft) 60%,transparent)}
.hello .plant{width:56px;height:44px;border-radius:12px}
.hello .plant svg{width:44px;height:44px}
.plant .tag{display:none}
.hello .garden-btn{font-size:11px;padding:4px 10px 4px 8px;gap:4px}
.hello .garden-btn svg{width:13px;height:13px}
/* streak card keeps only the plant and the garden button */
.streak .st-l,.streak .st-n,.streak .st-s{display:none}
.streak{padding:8px;gap:10px}
.streak .garden-btn{margin-top:0}
.hello .quote.fade{opacity:0}
.hello .status-note:empty{display:none}
.sky-deco{position:absolute;inset:0;pointer-events:none;z-index:0}
.sky-deco svg{position:absolute;inset:0;width:100%;height:100%}
.sky-dawn{--sky:linear-gradient(180deg,#FFE3C4 0%,#FFC9B8 55%,#F9E6DC 100%);--sky-ink:#383838;--veil:rgba(255,246,238,.85)}
.sky-day{--sky:linear-gradient(180deg,#BDEFEA 0%,#E4F8F5 70%,#F4FBFA 100%);--sky-ink:#383838;--veil:rgba(244,251,250,.85)}
.sky-sunset{--sky:linear-gradient(180deg,#5B3F7A 0%,#C8607A 55%,#F2A25E 100%);--sky-ink:#FFFFFF;--veil:rgba(60,40,80,.62)}
.sky-night{--sky:linear-gradient(180deg,#0E1A24 0%,#17303A 60%,#1F4148 100%);--sky-ink:#FFFFFF;--veil:rgba(14,26,36,.66)}
/* soft veil behind the greeting text (text sits on the right in RTL) */
.sky-deco::after{content:"";position:absolute;inset:0;background:linear-gradient(to left,var(--veil,transparent) 0%,var(--veil,transparent) 22%,transparent 52%)}
@media (max-width:620px){.sky-deco::after{background:linear-gradient(to bottom,var(--veil,transparent) 0%,var(--veil,transparent) 40%,transparent 75%)}}
.twinkle{animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
.cloud{animation:drift 40s linear infinite}
@keyframes drift{from{transform:translateX(-30px)}to{transform:translateX(30px)}}
.garden{display:flex;align-items:flex-end;gap:2px;margin-top:4px;flex-wrap:wrap}
.garden svg{width:18px;height:18px}
.garden .more{font-size:11px;color:var(--ink-3);margin-inline-start:4px}
.shelf{background:var(--surface);border-radius:18px;padding:10px 14px 12px;display:flex;flex-direction:column;gap:8px}
.shelf-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;width:100%;border:0;background:transparent;padding:2px 0;text-align:start;cursor:pointer;color:inherit}
.shelf-h .chev{width:16px;height:16px;margin-inline-start:auto;color:var(--ink-3);transition:transform .2s}
.shelf-h[aria-expanded="true"] .chev{transform:rotate(180deg)}
.shelf:has(.medals[hidden]){gap:0}
.shelf-h b{font-family:var(--f-display);font-weight:600;font-size:13px}
.shelf-h span{font-size:12px;color:var(--ink-3)}
.medals{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.medal{display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;min-width:0}
.medal .m{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-3);position:relative;transition:transform .2s}
.medal .m svg{width:16px;height:16px}
.medal.on .m{background:linear-gradient(160deg,#19C2B4,#08887D);color:#fff;box-shadow:0 0 0 2px var(--accent-soft),0 0 0 3.5px #F4B740}
.medal.on .m:hover{transform:rotate(-8deg) scale(1.05)}
.medal .nm{font-size:11px;font-weight:600;line-height:1.25}
.medal .pg{font-size:10px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.medal.on .pg{color:var(--accent)}
.medal.pop .m{animation:grow .9s cubic-bezier(.3,1.6,.5,1)}
.garden-btn{margin-top:6px;border:0;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:600;padding:5px 12px 5px 10px;display:inline-flex;align-items:center;gap:6px}
.garden-btn svg{width:15px;height:15px}
.garden-btn .lv{font-weight:500;opacity:.8}
.garden-btn .lv:not(:empty)::before{content:"· "}
.garden-btn:hover{background:var(--accent);color:var(--on-accent)}
.plant{cursor:pointer;position:relative}
.plant .tag{position:absolute;top:4px;left:50%;transform:translateX(-50%);font-size:9.5px;font-weight:600;line-height:1.5;background:var(--accent);color:var(--on-accent);border-radius:999px;padding:0 6px;white-space:nowrap}
.gview{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:min(1000px,calc(100% - 32px));max-height:calc(100% - 32px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow-y:auto;background:var(--surface);z-index:23;border-radius:28px;padding:20px 22px 22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 24px 80px rgba(20,20,20,.3);animation:pop .25s ease-out}
#g-scrim{z-index:22}
.g-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.g-l{font-size:12px;color:var(--ink-2)}
.g-lvl{font-family:var(--f-display);font-size:26px;font-weight:600;line-height:1.2}
.g-sub{font-size:13px;color:var(--ink-2)}
.g-scene svg{display:block;width:100%;height:auto;border-radius:20px}
.g-scene .new{animation:sprout .9s cubic-bezier(.3,1.6,.5,1) both;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sprout{from{transform:scale(0)}to{transform:scale(1)}}
.g-scene .glow{animation:tw 4s ease-in-out infinite}
.g-prog{display:flex;flex-direction:column;gap:6px}
.g-bar{height:8px;border-radius:8px;background:var(--surface-2);overflow:hidden}
.g-bar i{display:block;height:100%;background:linear-gradient(90deg,#19C2B4,#0A9488);border-radius:8px;transition:width .6s}
.g-next{font-size:13px;color:var(--ink-2)}
.g-next b{color:var(--ink)}
.g-list{display:flex;flex-wrap:wrap;gap:6px}
.g-list span{font-size:12px;border-radius:999px;padding:4px 10px;background:var(--surface-2);color:var(--ink-3)}
.g-list span.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.pl{transform-box:fill-box;transform-origin:50% 100%;animation:sway 4.5s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.plus{position:absolute;left:50%;top:48%;z-index:3;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:15px;border-radius:999px;padding:5px 14px;box-shadow:0 6px 20px rgba(10,120,110,.35);pointer-events:none;animation:floatUp 1.9s ease-out forwards}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,14px) scale(.8)}18%{opacity:1;transform:translate(-50%,0) scale(1.05)}100%{opacity:0;transform:translate(-50%,-56px) scale(1)}}
.hello .zoom{position:absolute;top:12px;left:12px;z-index:2;display:flex;flex-direction:column;gap:2px;background:color-mix(in srgb,var(--surface) 45%,transparent);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);border:1px solid color-mix(in srgb,var(--surface) 60%,transparent);border-radius:12px;padding:3px}
.zoom button{width:30px;height:30px;border:0;border-radius:9px;background:transparent;color:var(--ink);display:grid;place-items:center}
.zoom button:hover:not(:disabled){background:var(--surface-2)}
.zoom button:disabled{color:var(--ink-3);opacity:.5;cursor:default}
.zoom svg{width:15px;height:15px}
/* hover feedback (mouse only) */
.card{transition:transform .18s ease,box-shadow .18s ease,background-color .18s ease,border-color .18s ease}
.card .t{transition:color .18s ease}
.switch button,.search,.select,.done-toggle,.shelf-h,.garden-btn,.done-btn,.btn,.theme button,.stat{transition:background-color .18s ease,color .18s ease,border-color .18s ease,transform .18s ease,box-shadow .18s ease}
/* hover rules apply on every device (some touch laptops report no hover) */
  /* hovering a task box turns it solid teal with white text */
  .card:hover{transform:translateY(-4px);background:#0EA89C;border-color:#0EA89C;box-shadow:0 14px 30px -12px rgba(14,168,156,.75)}
  .card:hover .t,.card:hover .client,.card:hover .client span{color:#fff}
  .card:hover .chip{background:rgba(255,255,255,.22);color:#fff}
  .card:hover .done-btn{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.6);color:#fff}
  .card:hover .done-btn:hover{background:#fff;color:#0EA89C;border-color:#fff}
  .card:hover .prog{background:rgba(255,255,255,.3)}.card:hover .prog i{background:#fff}
  .card.done:hover{transform:none}
  .switch button:not([aria-pressed="true"]):hover{background:var(--surface-2);color:var(--ink)}
  .search:hover,.select:hover{border-color:var(--accent)}
  .done-toggle:hover,.shelf-h:hover b{color:var(--accent)}
  .done-toggle:hover{background:var(--accent-soft)}
  .btn-accent:hover{filter:brightness(1.06);box-shadow:0 6px 16px -6px var(--accent)}
  .btn-ghost:hover{background:var(--line)}
  .stat:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
  .theme button:not([aria-pressed="true"]):hover{background:var(--surface-2);color:var(--ink)}
/* garden life: birds, butterflies, rain */
.fly{animation:fly 36s linear infinite}
@keyframes fly{from{transform:translateX(-120px)}to{transform:translateX(1120px)}}
.flap{transform-box:fill-box;transform-origin:center;animation:flap .45s ease-in-out infinite alternate}
@keyframes flap{to{transform:scaleY(.3)}}
.bfly{animation:wander 14s ease-in-out infinite alternate}
@keyframes wander{0%{transform:translate(0,0)}20%{transform:translate(40px,-30px)}40%{transform:translate(85px,-5px)}60%{transform:translate(60px,28px)}80%{transform:translate(110px,10px)}100%{transform:translate(140px,-20px)}}
.wl,.wr{transform-box:fill-box;animation:wing .22s ease-in-out infinite alternate}
.wl{transform-origin:100% 50%}.wr{transform-origin:0% 50%}
@keyframes wing{to{transform:scaleX(.25)}}
.rain{animation:rain .9s linear infinite}
@keyframes rain{from{transform:translate(0,-60px)}to{transform:translate(-16px,60px)}}
.g-wx{font-size:13px;margin-top:4px;color:var(--ink);background:var(--surface-2);border-radius:999px;padding:3px 12px;display:inline-block}
.hello .wx-pill{position:absolute;top:16px;right:16px;z-index:2;font-size:12px;font-weight:500;background:color-mix(in srgb,var(--surface) 45%,transparent);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);border:1px solid color-mix(in srgb,var(--surface) 60%,transparent);border-radius:999px;padding:5px 12px;color:var(--ink);max-width:calc(100% - 90px)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:40}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--solid);color:var(--on-solid);padding:10px 18px;border-radius:999px;z-index:30;font-size:13px;max-width:calc(100% - 32px)}

@media (max-width:620px){
  body{padding-block:10px}
  .app{padding:14px;border-radius:22px;gap:18px}
  .switch{order:3;width:100%;margin:0}.switch button{flex:1 1 0;min-width:0;justify-content:center;padding:8px 2px;gap:4px;font-size:12px;white-space:nowrap}.switch .n{min-width:18px;padding:0 4px}
  .top .theme{margin-inline-start:auto}
  .streak{flex:0 0 auto}
  .hello{padding:18px}
  .medal .nm{font-size:10px}
  /* phones: tasks as squares, two per row */
  .board{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-items:stretch}
  .card{padding:12px;gap:6px;border-radius:16px;min-height:150px}
  .card .t{font-size:13px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .card .client{font-size:11.5px}
  .card-foot{margin-top:auto;gap:4px}
  .card-foot .chip{font-size:10.5px;padding:1px 7px}
  .card-foot .done-btn{width:100%;justify-content:center;margin:4px 0 0;padding:5px 8px;font-size:12px}
  .card .cover{margin:-12px -12px 2px;height:84px;border-radius:15px 15px 0 0}

  .gview{width:100%;max-height:100%;top:0;left:0;transform:none;inset:0;border-radius:0;animation:none;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
  .g-lvl{font-size:22px}
  .top{gap:8px}.theme button{width:32px;height:32px}.top .btn-accent{padding:9px 13px}.brand{padding:6px}.brand span{display:none}
  .bar h2{flex-basis:100%}
  .search{flex:1 1 160px}
  .grid2{grid-template-columns:1fr}
  .drawer{inset:0;top:0;left:0;transform:none;width:100%;height:100%;border-radius:0;animation:none;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  .drawer .d-body{padding:18px 20px 28px}
  .drawer .d-head,.drawer .d-foot{padding-inline:20px}
  .drawer .d-title{font-size:24px}
  .stat .num{font-size:24px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

      <label class="drop" id="f-drop"><input type="file" id="f-file" multiple accept="image/png,image/jpeg,image/gif,image/webp,image/svg+xml,video/mp4,video/webm,application/pdf,.txt,.md,.csv,.json" hidden><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15.5 9.5l-5.6 5.6a3.6 3.6 0 0 1-5.1-5.1l6-6a2.4 2.4 0 0 1 3.4 3.4l-6 6a1.2 1.2 0 0 1-1.7-1.7l5.5-5.5"/></svg><span>اسحب الملفات هنا أو اضغط للإرفاق</span><small>صور، فيديو MP4، PDF، أو ملفات نصية · حتى 20 ميجا · تقدر تلصق صورة مباشرة</small></label>
      <div class="att-off" id="att-off" hidden>المرفقات تشتغل في اللوحة المنشورة لما تكون مسجّل دخولك.</div>
      <div class="att-note" id="att-note" hidden></div>
    </div>
    <div class="field"><label for="f-notes">التفاصيل والملاحظات</label><textarea id="f-notes" placeholder="المتطلبات، الملاحظات، أي شيء تحتاج تتذكره..."></textarea></div>
  </div>
  <div class="d-foot">
    <button class="btn btn-accent" id="d-save"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8.5l3 3 6-6.5"/></svg>احفظ المهمة</button>
    <button class="btn btn-ghost" id="d-copy"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><rect x="5.5" y="5.5" width="8" height="8" rx="2"/><path d="M10.5 3.5v-.5a1.5 1.5 0 0 0-1.5-1.5H4A1.5 1.5 0 0 0 2.5 3v5A1.5 1.5 0 0 0 4 9.5h.5"/></svg>نسخ المهمة</button>
    <button class="btn btn-danger" id="d-delete">حذف المهمة</button>

  </div>
</aside>
<div class="toast" id="toast" hidden></div>
<canvas id="confetti" hidden></canvas>

<div class="gview" id="gview" dir="rtl" lang="ar" role="dialog" aria-modal="true" aria-label="حديقتي" hidden>
  <div class="g-head">
    <div><div class="g-l">حديقتي</div><div class="g-lvl" id="g-lvl">زرعة صغيرة</div><div class="g-sub" id="g-sub"></div><div class="g-wx" id="g-wx" hidden></div></div>
    <button class="icon-btn" id="g-close" aria-label="إغلاق"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
  </div>
  <div class="g-scene" id="g-scene"></div>
  <div class="g-prog"><div class="g-bar"><i id="g-bar"></i></div><div class="g-next" id="g-next"></div></div>
  <div class="g-list" id="g-list"></div>
</div>

<script>
(function(){
const WS={freelance:'Freelance',moremedia:'More Media',islamic:'Islamic'};
// work size; older tasks stored a priority (high/med/low) instead
const SIZE={easy:'سهل',med:'متوسط',big:'كبير'};
const WEIGHT={easy:1,med:2,big:3};
function sizeOf(t){if(SIZE[t.size])return t.size;return t.priority==='high'?'big':t.priority==='low'?'easy':'med'}
const $=id=>document.getElementById(id);
const state={days:[],badges:{},garden:{count:0,seen:0},ws:'freelance',clients:[],tasks:[],q:'',client:'',type:'',openId:null,showDone:false};
const TYPES=['بوست','كاروسيل','أنيميشن','فيديو','براند','محتوى','إنشاء فاتورة','أخرى'];
const TYPE_COLORS={'بوست':'#5B9BD5','كاروسيل':'#8E7CC3','أنيميشن':'#E0915E','فيديو':'#D46F7A','براند':'#3FA08A','محتوى':'#C29A3F','إنشاء فاتورة':'#6A8AA0','أخرى':'#8F8F8F'};
// work types: several per task; older tasks kept a single `type`
function typesOf(t){return Array.isArray(t.types)?t.types:(t.type?[t.type]:[])}
let db=null,mode='pending';
const queues={};

try{const w=localStorage.getItem('tb-ws');if(w&&WS[w])state.ws=w}catch(e){}

/* ---------- storage ---------- */
function localLoad(){try{return JSON.parse(localStorage.getItem('tb-tasks')||'[]')}catch(e){return[]}}
function localSave(){try{localStorage.setItem('tb-tasks',JSON.stringify(state.tasks))}catch(e){}}
function useLocal(){
  if(mode==='db')return;
  mode='local';state.tasks=localLoad();try{state.days=JSON.parse(localStorage.getItem('tb-days')||'[]')}catch(e){}try{state.badges=JSON.parse(localStorage.getItem('tb-badges')||'{}')}catch(e){}try{state.garden=Object.assign({count:0,seen:0},JSON.parse(localStorage.getItem('tb-garden')||'{}'))}catch(e){}try{state.clients=JSON.parse(localStorage.getItem('tb-clients')||'[]')}catch(e){}
  $('store-note').textContent='(يتم الحفظ في هذا المتصفح فقط)';
  render();
}
function body(t){const{id,...rest}=t;return JSON.parse(JSON.stringify(rest))}
function persist(t){
  t.updatedAt=Date.now();
  if(mode==='db'){
    const ref=db.collection('tasks').doc(t.id),b=body(t);
    queues[t.id]=(queues[t.id]||Promise.resolve()).then(()=>ref.set(b)).then(()=>flashSaved()).catch(err=>{toast(err&&err.code==='permission_denied'?'ليس لديك صلاحية التعديل':'تعذّر الحفظ، حاول مرة أخرى')});
  }else{localSave();flashSaved()}
}
function remove(id){
  state.tasks=state.tasks.filter(t=>t.id!==id);
  if(mode==='db'){
    queues[id]=(queues[id]||Promise.resolve()).then(()=>db.collection('tasks').doc(id).delete()).catch(()=>toast('تعذّر حذف المهمة'));
  }else localSave();
  render();
}
function newId(){if(mode==='db'){try{return db.collection('tasks').doc().id}catch(e){}}return 't'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}



/* ---------- helpers ---------- */
function today(){const d=new Date();d.setHours(0,0,0,0);return d}
function parseDate(s){if(!s)return null;const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function daysLeft(s){const d=parseDate(s);return d?Math.round((d-today())/864e5):null}
const fmt=new Intl.DateTimeFormat('ar-u-nu-latn',{day:'numeric',month:'short'});
function dueChip(t){
  const n=daysLeft(t.due);if(n===null)return null;
  const el=document.createElement('span');el.className='chip';
  let txt=fmt.format(parseDate(t.due));
  if(t.status!=='done'){
    if(n<0){el.classList.add('late');txt+=' · متأخرة'}
    else if(n===0){el.classList.add('soon');txt='اليوم'}
    else if(n===1){el.classList.add('soon');txt='غدًا'}
    else if(n<=3){el.classList.add('soon');txt+=` · باقي ${n} أيام`}
  }
  el.textContent=txt;return el;
}
function toast(msg){const t=$('toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2600)}
function flashSaved(){if(!state.openId)return;$('d-saved').textContent='تم الحفظ';clearTimeout(flashSaved._t);flashSaved._t=setTimeout(()=>$('d-saved').textContent='',1500)}
const plusSvg='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>';
const userSvg='<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="8" cy="5.5" r="2.8"/><path d="M2.8 14c.6-2.8 2.7-4.3 5.2-4.3s4.6 1.5 5.2 4.3"/></svg>';

/* ---------- render ---------- */
function wsTasks(){return state.tasks.filter(t=>(t.workspace||'freelance')===state.ws)}
function render(){
  renderStreak();renderSky();renderMedals();renderGardenBtn();
  for(const w in WS){$('ws-'+w).setAttribute('aria-pressed',String(w===state.ws));$('n-'+w).textContent=state.tasks.filter(t=>(t.workspace||'freelance')===w&&t.status!=='done').length}
  $('board-title').textContent='لوحة '+WS[state.ws];

  const all=wsTasks();
  const open=all.filter(t=>t.status!=='done');
  $('s-open').textContent=open.length;
  const done=all.length-open.length;
  $('s-done').textContent=done;$('s-done-sub').textContent=`من أصل ${all.length}`;
  $('s-open-sub').textContent='باقية في '+WS[state.ws];

  // clients
  const clients=[...new Set(state.tasks.map(t=>(t.client||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ar'));
  const wsClients=[...new Set(all.map(t=>(t.client||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ar'));
  const sel=$('client-filter');
  if(state.client&&!wsClients.includes(state.client))state.client='';
  sel.replaceChildren(new Option('كل العملاء',''),...wsClients.map(c=>new Option(c,c)));sel.value=state.client;

  const q=state.q.trim().toLowerCase();
  const shown=all.filter(t=>(!state.client||(t.client||'').trim()===state.client)&&(!state.type||typesOf(t).includes(state.type))&&(!q||[t.title,t.client,t.notes].join(' ').toLowerCase().includes(q)));

  // oldest open task first, so the ones waiting longest stay in view
  const openShown=shown.filter(t=>t.status!=='done').sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
  const doneShown=shown.filter(t=>t.status==='done').sort((a,b)=>(b.completedAt||b.updatedAt||0)-(a.completedAt||a.updatedAt||0));
  const board=$('board');board.replaceChildren(...openShown.map(cardEl));
  if(!openShown.length){const e=document.createElement('div');e.className='empty';
    e.textContent=(q||state.client)?'لا توجد مهام مطابقة':(all.length?'أنجزت كل المهام في '+WS[state.ws]+'. أضف مهمة جديدة متى ما احتجت':'لا توجد مهام بعد. اضغط "مهمة جديدة" لإضافة أول مهمة');board.append(e)}
  $('done-n').textContent=doneShown.length;
  $('done-toggle').hidden=!doneShown.length;
  $('done-toggle').setAttribute('aria-expanded',String(state.showDone));
  const db2=$('done-board');db2.hidden=!state.showDone||!doneShown.length;db2.replaceChildren(...doneShown.map(cardEl));
}
const checkSvg='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.5l3 3 6-6.5"/></svg>';
function toggleDone(t,el){
  const finishing=t.status!=='done';
  const go=()=>{if(finishing){t.status='done';t.completedAt=Date.now()}else{t.status='todo';delete t.completedAt}persist(t);render();celebrate(finishing,t)};
  if(el&&finishing&&!matchMedia('(prefers-reduced-motion: reduce)').matches){el.classList.add('leaving');setTimeout(go,230)}else go();
}
function cardEl(t){
  const b=document.createElement('div');b.className='card'+(t.status==='done'?' done':'');{const c=TYPE_COLORS[typesOf(t)[0]];if(c)b.style.setProperty('--c',c)}b.tabIndex=0;b.setAttribute('role','button');
  const cov=attsOf(t).find(a=>(a.type||'').startsWith('image/'));
  if(cov){const c=document.createElement('div');c.className='cover';const im=document.createElement('img');im.src='/_blob/'+cov.id;im.alt='';im.loading='lazy';im.onerror=()=>c.remove();c.append(im);b.append(c)}
  const ti=document.createElement('div');ti.className='t';ti.textContent=t.title||'بدون عنوان';b.append(ti);
  if(t.client){const c=document.createElement('div');c.className='client';c.innerHTML=userSvg;const sp=document.createElement('span');sp.textContent=t.client;c.append(sp);b.append(c)}
  const ch=Array.isArray(t.checklist)?t.checklist:[];
  if(ch.length&&t.status!=='done'){const pr=document.createElement('div');pr.className='prog';const i=document.createElement('i');i.style.width=(ch.filter(x=>x.done).length/ch.length*100)+'%';pr.append(i);b.append(pr)}
  const m=document.createElement('div');m.className='card-foot';
  for(const ty of typesOf(t)){const k=document.createElement('span');k.className='chip kind';k.textContent=ty;k.style.setProperty('--c',TYPE_COLORS[ty]||'#9A9A9A');m.append(k)}
  {const age=ageDays(t);if(t.status!=='done'&&age>3){const a=document.createElement('span');a.className='chip late';a.textContent=`صار لها ${daysAr(age)}`;a.title='المهام اللي تطول أكثر من 3 أيام تعكّر جو الحديقة';m.append(a)}}
  if(t.status!=='done'){const z=sizeOf(t);const p=document.createElement('span');p.className='chip size-'+z;p.textContent=SIZE[z];m.append(p)}
  if(ch.length){const d=ch.filter(x=>x.done).length;const p=document.createElement('span');p.className='chip'+(d===ch.length?' ok':'');p.textContent=`${d}/${ch.length}`;m.append(p)}
  if(attsOf(t).length){const p=document.createElement('span');p.className='chip';p.innerHTML=clipSvg;p.append(String(attsOf(t).length));p.setAttribute('aria-label',attsOf(t).length+' مرفقات');m.append(p)}
  const btn=document.createElement('button');btn.className='done-btn';
  if(t.status==='done'){btn.textContent='إرجاع'}else{btn.innerHTML=checkSvg+'<span>اكتملت</span>'}
  btn.onclick=e=>{e.stopPropagation();toggleDone(t,b)};
  m.append(btn);b.append(m);
  b.onclick=()=>openTask(t.id);
  // drop files straight onto the card to attach them
  b.addEventListener('dragover',e=>{if([...e.dataTransfer.types].includes('Files')){e.preventDefault();b.classList.add('drop-over')}});
  b.addEventListener('dragleave',e=>{if(!b.contains(e.relatedTarget))b.classList.remove('drop-over')});
  b.addEventListener('drop',async e=>{b.classList.remove('drop-over');const fs=[...e.dataTransfer.files];if(!fs.length)return;e.preventDefault();
    if(!assets){toast('المرفقات تشتغل في اللوحة المنشورة لما تكون مسجّل دخولك');return}
    toast('جارٍ رفع الملف…');const ok=await addFiles(fs,t);if(ok)toast(ok===1?'انضاف الملف للمهمة':`انضافت ${ok} ملفات للمهمة`)});
  b.addEventListener('keydown',e=>{if(e.target===b&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openTask(t.id)}});
  return b;
}

/* ---------- drawer ---------- */
let draftDirty=false,saveTimer=null;
function cur(){return state.tasks.find(t=>t.id===state.openId)}
function createTask(status){
  if(mode==='pending'){toast('لحظة، يتم تحميل المهام...');return}
  const t={id:newId(),workspace:state.ws,title:'',client:state.client||'',status:status||'todo',size:'med',due:'',types:[],link:'',notes:'',checklist:[],createdAt:Date.now()};
  state.tasks.push(t);persist(t);render();openTask(t.id,true);
}
function openTask(id,focusTitle){
  const t=state.tasks.find(x=>x.id===id);if(!t)return;
  state.openId=id;draftDirty=false;
  $('d-ws').textContent=WS[t.workspace||'freelance'];
  $('f-title').value=t.title||'';
  $('f-size').value=sizeOf(t);
  $('f-link').value=t.link||'';$('f-notes').value=t.notes||'';
  editClients=false;$('client-add').hidden=true;renderStatus();renderClients();$('client-auto').hidden=true;renderType();renderChecks();renderAtts();resetDelete();$('att-note').hidden=true;
  const c=t.createdAt?new Date(t.createdAt):null;
  $('d-meta').textContent=c?'أُنشئت '+new Intl.DateTimeFormat('ar-u-nu-latn',{day:'numeric',month:'short',year:'numeric'}).format(c):'';
  $('scrim').hidden=false;$('drawer').hidden=false;
  (focusTitle?$('f-title'):$('d-close')).focus();
}
function closeTask(){if(document.activeElement&&$('drawer').contains(document.activeElement))document.activeElement.blur();flush();state.openId=null;$('scrim').hidden=true;$('drawer').hidden=true;render()}
function flush(){if(saveTimer){clearTimeout(saveTimer);saveTimer=null;const t=cur();if(t)persist(t)}draftDirty=false}
function schedule(){draftDirty=true;clearTimeout(saveTimer);saveTimer=setTimeout(()=>{saveTimer=null;const t=cur();if(t)persist(t);draftDirty=false;render()},700)}
const fieldMap={'f-title':'title','f-size':'size','f-link':'link','f-notes':'notes'};
for(const fid in fieldMap){
  const el=$(fid);
  el.addEventListener('input',()=>{const t=cur();if(!t)return;t[fieldMap[fid]]=el.value;schedule()});
  el.addEventListener('change',()=>{flush();render()});
}
/* ---------- attachments ---------- */
let assets=null,pending=[];
const clipSvg='<svg width="12" height="12" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15.5 9.5l-5.6 5.6a3.6 3.6 0 0 1-5.1-5.1l6-6a2.4 2.4 0 0 1 3.4 3.4l-6 6a1.2 1.2 0 0 1-1.7-1.7l5.5-5.5"/></svg>';
const EXT={png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',gif:'image/gif',webp:'image/webp',svg:'image/svg+xml',mp4:'video/mp4',webm:'video/webm',pdf:'application/pdf',txt:'text/plain',md:'text/markdown',csv:'text/csv',json:'application/json'};
const OK_TYPES=Object.values(EXT);
function attsOf(t){return Array.isArray(t.attachments)?t.attachments:[]}
function fileType(f){if(OK_TYPES.includes(f.type))return f.type;const e=(f.name.split('.').pop()||'').toLowerCase();return EXT[e]||null}
function attNote(msg){const n=$('att-note');n.textContent=msg;n.hidden=!msg}
function attErr(e,name){const c=e&&e.code;
  if(c==='too_large')return `«${name}» أكبر من الحد المسموح (20 ميجا).`;
  if(c==='unsupported_type')return `«${name}»: هذا النوع غير مدعوم. ارفع صورة أو فيديو MP4 أو PDF أو ملف نصي.`;
  if(c==='quota_or_state')return 'مساحة التخزين ممتلئة. احذف مرفقات قديمة وحاول مرة ثانية.';
  if(c==='rate_limited')return 'محاولات كثيرة ورا بعض، انتظر شوي وحاول مرة ثانية.';
  if(c==='not_granted'||c==='capability_disabled'||c==='capability_removed')return 'رفع الملفات غير متاح هنا.';
  if(c==='upstream_auth')return 'انتهت الجلسة. حدّث الصفحة أو سجّل دخولك مرة ثانية.';
  return `تعذّر رفع «${name}»، حاول مرة ثانية.`}
async function addFiles(files,toTask){
  const t0=toTask||cur();if(!t0||!assets||!files.length)return 0;
  const tid=t0.id;if(!toTask)attNote('');let ok=0;
  for(const f of files){
    const type=fileType(f);
    const say=m=>toTask?toast(m):attNote(m);
    if(!type){say(`«${f.name}»: هذا النوع غير مدعوم. ارفع صورة أو فيديو MP4 أو PDF أو ملف نصي.`);continue}
    if(f.size>(type==='image/svg+xml'?2:20)*1048576){say(`«${f.name}» أكبر من ${type==='image/svg+xml'?2:20} ميجا.`);continue}
    const p={tid,name:f.name};pending.push(p);renderAtts();
    try{
      let r;
      try{r=await assets.upload(f,{type})}
      catch(e){if(e&&e.code==='store_unavailable'){await new Promise(res=>setTimeout(res,1500));r=await assets.upload(f,{type})}else throw e}
      const live=state.tasks.find(x=>x.id===tid);
      if(live){live.attachments=attsOf(live).concat({id:r.id,name:f.name,type:r.contentType,size:r.sizeBytes,addedAt:Date.now()});persist(live);ok++}
    }catch(e){if(toTask)toast(attErr(e,f.name));else attNote(attErr(e,f.name))}
    finally{pending=pending.filter(x=>x!==p);renderAtts();render()}
  }
  return ok;
}
function renderAtts(){
  const t=cur();if(!t||$('drawer').hidden)return;
  const wrap=$('f-atts');wrap.replaceChildren();
  $('f-drop').hidden=!assets;$('att-off').hidden=!!assets||attsOf(t).length>0;
  for(const a of attsOf(t)){
    const box=document.createElement('div');box.className='att';
    const link=document.createElement('a');link.href='/_blob/'+a.id;link.target='_blank';link.rel='noopener';link.title=a.name||'';
    const ty=a.type||'';
    const fallback=()=>{link.replaceChildren();const x=document.createElement('span');x.className='ext';x.textContent=(a.name||'').split('.').pop().toUpperCase().slice(0,4)||'FILE';const nm=document.createElement('span');nm.className='nm';nm.textContent=a.name||'ملف';link.append(x,nm)};
    if(ty.startsWith('image/')){const im=document.createElement('img');im.src='/_blob/'+a.id;im.alt=a.name||'';im.loading='lazy';im.onerror=fallback;link.append(im)}
    else if(ty.startsWith('video/')){const v=document.createElement('video');v.src='/_blob/'+a.id;v.muted=true;v.preload='metadata';v.onerror=fallback;link.append(v)}
    else fallback();
    box.append(link);
    if(assets){const rm=document.createElement('button');rm.className='rm';rm.textContent='×';rm.setAttribute('aria-label','حذف المرفق');
      rm.onclick=()=>{
        if(!rm.classList.contains('armed')){rm.classList.add('armed');rm.textContent='حذف؟';setTimeout(()=>{if(rm.isConnected){rm.classList.remove('armed');rm.textContent='×'}},3000);return}
        t.attachments=attsOf(t).filter(x=>x.id!==a.id);persist(t);renderAtts();render();
        assets.delete(a.id).catch(()=>{});
      };box.append(rm)}
    wrap.append(box);
  }
  for(const p of pending.filter(x=>x.tid===t.id)){
    const box=document.createElement('div');box.className='att uploading';

/* ---------- confetti ---------- */
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const cv=$('confetti');cv.hidden=false;const dpr=window.devicePixelRatio||1;cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;
  const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);
  const cols=['#0EA89C','#19C2B4','#383838','#F4B740','#FFFFFF','#C8607A'];
  const ps=Array.from({length:140},()=>({x:innerWidth/2+(Math.random()-.5)*160,y:innerHeight*.35,vx:(Math.random()-.5)*11,vy:-Math.random()*12-4,r:Math.random()*Math.PI,vr:(Math.random()-.5)*.3,w:6+Math.random()*6,h:4+Math.random()*4,c:cols[Math.floor(Math.random()*cols.length)]}));
  const t0=performance.now();
  (function frame(t){const k=(t-t0)/1800;ctx.clearRect(0,0,innerWidth,innerHeight);
    for(const p of ps){p.vy+=.32;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.globalAlpha=Math.max(0,1-k);ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.strokeStyle='rgba(0,0,0,.08)';ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.strokeRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore()}
    if(k<1)requestAnimationFrame(frame);else{ctx.clearRect(0,0,innerWidth,innerHeight);cv.hidden=true}})(t0);
}

function celebrate(finishing,t){
  if(!finishing){toast('رجعت المهمة إلى قائمة المهام');renderStreak();renderMedals();return}
  const had=state.days.includes(dayKey(new Date()));
  const nBefore=had?streakNow():streakNow(true);
  const before=stageOf(cycleOf(nBefore)).name,palmsBefore=palmCount();
  const wk=weekId(),oldIds=(state.badges[wk]||[]).slice();
  const gBefore=gardenCount();const gAfter=growGarden(t);const w=t?WEIGHT[sizeOf(t)]:1;const newStruct=STRUCTS.filter(x=>x.at>gBefore&&x.at<=gAfter).pop();
  const first=logToday();const n=streakNow();const after=stageOf(cycleOf(n)).name,palmsAfter=palmCount();
  const nowOn=weekBadges().filter(b=>b.on);const newOnes=nowOn.filter(b=>!oldIds.includes(b.id));
  if(newOnes.length){saveBadges([...new Set(oldIds.concat(nowOn.map(b=>b.id)))]);popIds=newOnes.map(b=>b.id)}
  renderStreak();renderMedals();renderGardenBtn();if(gAfter>gBefore)plusBubble(gAfter-gBefore);
  const wsName=t?WS[t.workspace||'freelance']:'';
  const sectionClear=t&&!state.tasks.some(x=>(x.workspace||'freelance')===(t.workspace||'freelance')&&x.status!=='done');
  if(newStruct){confetti();toast(`${newStruct.msg} افتح حديقتك وشوف 🌿`)}
  else if(palmsAfter>palmsBefore){confetti();toast(`نخلة جديدة انضافت لحديقتك! 🌴 ${daysAr(n)} ورا بعض`)}
  else if(newOnes.length){confetti();toast(`حصلت على وسام «${newOnes[0].name}» 🏅`)}
  else if(sectionClear){confetti();toast(`خلّصت كل مهام ${wsName}! 🎉`)}
  else if(after!==before)toast(`نبتتك كبرت! صارت ${after} 🌱 سلسلة ${daysAr(n)}`);
  else if(first)toast(n>1?`أحسنت! سلسلة الإنجاز صارت ${daysAr(n)}`:'أحسنت! بدأت سلسلة الإنجاز اليوم');
  else toast(`أحسنت! ${w===1?'انزرعت زرعة':w===2?'انزرعت زرعتين':'انزرعت 3 زرعات'} في حديقتك 🌱`);
}

  'كل كاروسيل يبدأ بشريحة وحدة.',
  'البساطة أصعب من الزخرفة، وأجمل.',
  'خلّص اللي بيدك قبل ما تفكر باللي بعده.',
  'أفضل وقت تبدأ فيه كان أمس، وثاني أفضل وقت الحين.',
  'ركّز 25 دقيقة، وارتاح 5.',
  'الفكرة الحلوة تستاهل تنفيذ يليق فيها.',
  'لا تقارن بدايتك بنهاية غيرك.',
  'اشتغل بهدوء، وخل شغلك يتكلم.',
  'صغّر المهمة لين تصير سهلة تبدأها.',
  'الانضباط يوصلك لما يخلص الحماس.',
  'المسودة الأولى مو لازم تكون حلوة، لازم تكون موجودة.',
  'من زرع حصد.',
  'كل يوم تنجز فيه شي، يوم ما راح عليك.',
  'خذ نفس، رتّب أولوياتك، وابدأ.',
  'التصميم الحلو يحل مشكلة قبل ما يكون جميل.',
  'القليل الدائم يغلب الكثير المتقطع.',
  '﴿وَأَنْ لَيْسَ لِلْإِنْسَانِ إِلَّا مَا سَعَى﴾',
  'إنجاز بسيط اليوم أحسن من مثالي ما يصير.',
  'افتخر بتقدمك، مو بس بالنتيجة.',
  'افتح الملف، والباقي يجي.',
  'حديقتك ما تكبر بالتفكير، تكبر بالشغل.'
];
let lastQuote=-1;
function renderQuote(){
  const i=Math.floor(Date.now()/6e5)%QUOTES.length;if(i===lastQuote)return;
  const el=$('quote');
  if(lastQuote<0||matchMedia('(prefers-reduced-motion: reduce)').matches){el.textContent=QUOTES[i]}
  else{el.classList.add('fade');setTimeout(()=>{el.textContent=QUOTES[i];el.classList.remove('fade')},500)}
  lastQuote=i;
}
// line up with the next 10-minute mark, then tick every 10 minutes
setTimeout(()=>{renderQuote();setInterval(renderQuote,6e5)},6e5-Date.now()%6e5+50);

/* ---------- sky over the greeting, by time of day ---------- */
function periodOf(h){if(h>=5&&h<8)return 'dawn';if(h>=8&&h<16)return 'day';if(h>=16&&h<19)return 'sunset';return 'night'}
function rnd(seed){return()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646}}
const SKY={
  dawn:'<svg viewBox="0 0 800 160" preserveAspectRatio="xMidYMax slice"><g transform="translate(330 168)"><circle r="70" fill="#FFB36B" opacity=".35"/><circle r="46" fill="#FF9F5A"/></g><g stroke="#FF9F5A" stroke-width="3" stroke-linecap="round" opacity=".5"><path d="M330 80v-18M268 104l-12-12M392 104l12-12M240 150h-18M420 150h18"/></g><g class="cloud" fill="#fff" opacity=".7"><ellipse cx="520" cy="60" rx="46" ry="14"/><ellipse cx="545" cy="50" rx="26" ry="14"/></g></svg>',
  day:'<svg viewBox="0 0 800 160" preserveAspectRatio="xMidYMid slice"><circle cx="360" cy="46" r="44" fill="#FFE08A" opacity=".35"/><circle cx="360" cy="46" r="26" fill="#FFD25E"/><g class="cloud" fill="#fff"><ellipse cx="200" cy="70" rx="50" ry="15"/><ellipse cx="228" cy="58" rx="28" ry="16"/><ellipse cx="520" cy="40" rx="40" ry="12"/><ellipse cx="540" cy="31" rx="22" ry="12"/></g></svg>',
  sunset:'<svg viewBox="0 0 800 160" preserveAspectRatio="xMidYMax slice"><circle cx="340" cy="150" r="80" fill="#FFC069" opacity=".25"/><circle cx="340" cy="150" r="52" fill="#FFB054"/><g stroke="#3A2650" stroke-width="2" fill="none" stroke-linecap="round" opacity=".6"><path d="M470 48q6-6 12 0q6-6 12 0"/><path d="M500 62q5-5 10 0q5-5 10 0"/></g></svg>'
};
function nightSky(){const r=rnd(7);let st='';for(let i=0;i<60;i++){const x=(r()*800).toFixed(0),y=(r()*150).toFixed(0),rad=(r()*1.4+.4).toFixed(1),tw=r()<.35;st+=`<circle cx="${x}" cy="${y}" r="${rad}" fill="#fff" ${tw?`class="twinkle" style="animation-delay:${(r()*3).toFixed(2)}s"`:'opacity=".7"'}/>`}
  return `<svg viewBox="0 0 800 160" preserveAspectRatio="xMidYMid slice">${st}<g transform="translate(360 52)"><circle r="24" fill="#FFF4D6"/><circle cx="10" cy="-6" r="22" fill="#132834"/></g></svg>`}
let lastPeriod=null,bannerN=null;
// banner zoom: + to get closer to the plant, − to see more of the garden
const ZOOMS=[0.5,0.7,1,1.4,2,2.8];let zoomI=2;
try{const z=parseInt(localStorage.getItem('tb-zoom'),10);if(z>=0&&z<ZOOMS.length)zoomI=z}catch(e){}
function setZoom(d){const nz=Math.max(0,Math.min(ZOOMS.length-1,zoomI+d));if(nz===zoomI)return;zoomI=nz;try{localStorage.setItem('tb-zoom',String(zoomI))}catch(e){}showZoom();renderSky()}
function showZoom(){$('z-in').disabled=zoomI===ZOOMS.length-1;$('z-out').disabled=zoomI===0}
function plusBubble(w){const el=document.createElement('span');el.className='plus';el.textContent=`+${w} 🌱`;$('hello').append(el);setTimeout(()=>el.remove(),2000)}
function renderSky(){
  const h=new Date().getHours(),per=periodOf(h);
  renderQuote();
  const n=gardenCount(),palms=palmCount(),key=per+'|'+n+'|'+palms+'|'+zoomI+'|'+weatherNow();
  if(key===lastPeriod)return;lastPeriod=key;
  const from=bannerN===null||n<bannerN?n:bannerN;bannerN=n;
  {const w=weatherNow(),pill=$('wx-pill');pill.hidden=w==='normal';pill.textContent=w==='gloomy'?'☁️ الجو متعكّر: عندك مهام صار لها أكثر من 3 أيام':w==='spring'?'🌧️ ربيع: قاعد تخلّص بسرعة':''}
  const el=$('hello');el.classList.remove('sky-dawn','sky-day','sky-sunset','sky-night');el.classList.add('sky-'+per);
  // the banner shows your garden as it is now, cropped to the fence, house and plants
  // mirrored and shifted so the house and plants sit between the greeting (right) and the streak card (left)
  const full=gardenSVG(n,palms,from,from<n,true).replace(/id="g([sgr])"/g,'id="b$1"').replace(/url\(#g([sgr])\)/g,'url(#b$1)');
  // empty garden: put the shoot in the middle of the banner
  const inner=full.slice(full.indexOf('>')+1,full.lastIndexOf('</svg>')).replace('translate(500 430) scale(3.2)',innerWidth<=620?'translate(576 336) scale(2.3)':'translate(576 350) scale(2.6)')
    // bring the sun, clouds and moon down into the banner's sky
    .replace('<circle cx="860" cy="80" r="34"','<circle cx="860" cy="172" r="26"').replace('cy="80" rx="60"','cy="160" rx="60"').replace('cy="66" rx="32"','cy="146" rx="32"').replace('cy="55" rx="44"','cy="140" rx="44"').replace('cx="560" cy="140"','cx="640" cy="140"').replace('translate(860 70)','translate(860 172) scale(.85)');
  const z=ZOOMS[zoomI],W=1000/z,H=340/z,vx=500-W/2,cy=z>1?(innerWidth<=620?318:330):(innerWidth<=620?300:260),vy=Math.min(cy-H/2,560-H*0.55);
  $('sky-deco').innerHTML=`<svg viewBox="${vx.toFixed(1)} ${vy.toFixed(1)} ${W.toFixed(1)} ${H.toFixed(1)}" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><g transform="translate(1180 0) scale(-1.18 1)">${inner}</g></svg>`;
}
setInterval(()=>{renderSky();renderStreak()},10*60*1000);

function renderType(){
  const t=cur(),wrap=$('f-type');wrap.replaceChildren();
  const sel=typesOf(t);
  for(const k of TYPES){const b=document.createElement('button');b.textContent=k;b.className='tc';b.style.setProperty('--c',TYPE_COLORS[k]||'#9A9A9A');b.setAttribute('aria-pressed',String(sel.includes(k)));
    b.onclick=()=>{const cur=typesOf(t);const next=cur.includes(k)?cur.filter(x=>x!==k):cur.concat(k);
      t.types=TYPES.filter(x=>next.includes(x));delete t.type;persist(t);renderType();render()};wrap.append(b)}
}
function renderStatus(){
  const t=cur(),b=$('f-complete'),done=t.status==='done';
  b.className='btn '+(done?'btn-ghost':'btn-accent');
  b.innerHTML=done?'إرجاع إلى المهام':checkSvg.replace('<svg','<svg width="16" height="16"')+'اكتملت';
}
$('f-complete').onclick=()=>{const t=cur();if(!t)return;flush();const finishing=t.status!=='done';
  if(finishing){t.status='done';t.completedAt=Date.now()}else{t.status='todo';delete t.completedAt}
  persist(t);closeTask();celebrate(finishing,t)};
function renderChecks(){
  const t=cur(),wrap=$('f-checks');wrap.replaceChildren();
  if(!Array.isArray(t.checklist))t.checklist=[];
  t.checklist.forEach((c,i)=>{
    const row=document.createElement('div');row.className='chk'+(c.done?' done':'');
    const cb=document.createElement('input');cb.type='checkbox';cb.checked=!!c.done;cb.id='chk-'+i;cb.setAttribute('aria-label','تم');
    cb.onchange=()=>{c.done=cb.checked;persist(t);renderChecks();render()};
    const tx=document.createElement('input');tx.type='text';tx.value=c.text||'';tx.id='chkt-'+i;tx.setAttribute('aria-label','الخطوة');
    tx.oninput=()=>{c.text=tx.value;schedule()};
    const x=document.createElement('button');x.className='x';x.textContent='×';x.setAttribute('aria-label','حذف الخطوة');
    x.onclick=()=>{t.checklist.splice(i,1);persist(t);renderChecks();render()};
    row.append(cb,tx,x);wrap.append(row);
  });
}
function addCheck(){const v=$('f-newchk').value.trim();const t=cur();if(!v||!t)return;t.checklist=(t.checklist||[]).concat({text:v,done:false});$('f-newchk').value='';persist(t);renderChecks();render()}
$('f-addchk').onclick=addCheck;
$('f-newchk').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addCheck()}});
let delArmed=false,delTimer;
function resetDelete(){delArmed=false;clearTimeout(delTimer);$('d-delete').textContent='حذف المهمة'}
$('d-delete').onclick=()=>{
  if(!delArmed){delArmed=true;$('d-delete').textContent='اضغط مرة ثانية للتأكيد';delTimer=setTimeout(resetDelete,3500);return}
  const id=state.openId,assetIds=attsOf(cur()||{}).map(a=>a.id);clearTimeout(saveTimer);saveTimer=null;state.openId=null;$('scrim').hidden=true;$('drawer').hidden=true;remove(id);toast('تم حذف المهمة');
  if(assets)(async()=>{for(const a of assetIds){try{await assets.delete(a)}catch(e){}}})();
};
$('d-close').onclick=closeTask;$('scrim').onclick=closeTask;
// save now and close (changes also save on their own while typing)
$('d-save').onclick=()=>{const t=cur();if(!t)return;clearTimeout(saveTimer);saveTimer=null;persist(t);draftDirty=false;closeTask();toast('تم حفظ المهمة')};
// copy a task: same details and steps (unticked), no due date or attachments, opens the copy
$('d-copy').onclick=()=>{
  const t=cur();if(!t)return;flush();
  const c=JSON.parse(JSON.stringify(t));
  Object.assign(c,{id:newId(),title:(t.title||'بدون عنوان')+' (نسخة)',status:'todo',due:'',attachments:[],createdAt:Date.now(),checklist:(t.checklist||[]).map(x=>({text:x.text,done:false}))});
  delete c.completedAt;delete c.clientAuto;
  state.tasks.push(c);persist(c);closeTask();openTask(c.id,true);toast('انعملت نسخة من المهمة');
};
document.addEventListener('keydown',e=>{
  const typing=/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement&&document.activeElement.tagName)||(document.activeElement&&document.activeElement.isContentEditable);
  if(!typing&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&$('drawer').hidden&&$('gview').hidden){
    if(e.code==='KeyN'){e.preventDefault();createTask('todo');return}
    if(e.code==='Slash'){e.preventDefault();$('q').focus();return}
  }
  if(e.key!=='Escape')return;if(!$('gview').hidden)closeGarden();else if(state.openId)closeTask()});

/* ---------- top controls ---------- */
for(const w in WS)$('ws-'+w).onclick=()=>{state.ws=w;state.client='';state.showDone=false;try{localStorage.setItem('tb-ws',w)}catch(e){}render()};
/* ---------- light / night mode ---------- */
function themeNow(){const a=document.documentElement.getAttribute('data-theme');if(a==='dark'||a==='light')return a;return matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}
function showTheme(){const t=themeNow();$('th-light').setAttribute('aria-pressed',String(t==='light'));$('th-dark').setAttribute('aria-pressed',String(t==='dark'))}
function setTheme(t){document.documentElement.setAttribute('data-theme',t);try{localStorage.setItem('tb-theme',t)}catch(e){}showTheme()}
try{const saved=localStorage.getItem('tb-theme');if(saved==='dark'||saved==='light')document.documentElement.setAttribute('data-theme',saved)}catch(e){}
showTheme();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',showTheme);
$('th-light').onclick=()=>setTheme('light');$('th-dark').onclick=()=>setTheme('dark');
/* badges shelf: open or closed, remembered per browser */
function setShelf(open){$('medals').hidden=!open;$('shelf-toggle').setAttribute('aria-expanded',String(open));try{localStorage.setItem('tb-shelf',open?'1':'0')}catch(e){}}
try{if(localStorage.getItem('tb-shelf')==='1'){$('medals').hidden=false;$('shelf-toggle').setAttribute('aria-expanded','true')}}catch(e){}
$('shelf-toggle').onclick=()=>setShelf($('medals').hidden);
$('z-in').onclick=()=>setZoom(1);$('z-out').onclick=()=>setZoom(-1);showZoom();
$('new-top').onclick=()=>createTask('todo');
$('done-toggle').onclick=()=>{state.showDone=!state.showDone;render()};
$('q').addEventListener('input',e=>{state.q=e.target.value;render()});
$('client-filter').addEventListener('change',e=>{state.client=e.target.value;render()});
$('type-filter').addEventListener('change',e=>{state.type=e.target.value;render()});

render();
if(window.claude&&typeof window.claude.use==='function'){
  window.claude.use('assets').then(a=>{assets=a||null;if(state.openId)renderAtts()}).catch(()=>{});
  window.claude.use('db').then(d=>{
    if(!d){useLocal();return}
    db=d;mode='db';$('store-note').textContent='';
    db.collection('tasks').onSnapshot(snap=>{
      const incoming=snap.docs.map(s=>Object.assign({id:s.id},s.data()));
      // keep the open task's in-progress edits
      if(state.openId&&draftDirty){const cur=state.tasks.find(t=>t.id===state.openId);const i=incoming.findIndex(t=>t.id===state.openId);if(cur&&i>-1)incoming[i]=cur}
      state.tasks=incoming;render();
    },()=>{toast('انقطع الاتصال بقاعدة البيانات');});
    db.doc('meta/garden').onSnapshot(snap=>{const d=snap.exists&&snap.data();state.garden=Object.assign({count:0,seen:0},d||{});renderGardenBtn();if(!$('gview').hidden)renderGarden(false)},()=>{});
    db.doc('meta/badges').onSnapshot(snap=>{const d=snap.exists&&snap.data();state.badges=d&&d.weeks&&typeof d.weeks==='object'?d.weeks:{};renderMedals()},()=>{});
    db.doc('meta/days').onSnapshot(snap=>{const d=snap.exists&&snap.data();state.days=d&&Array.isArray(d.days)?d.days:[];renderStreak()},()=>{});
    db.collection('clients').onSnapshot(snap=>{state.clients=snap.docs.map(s=>Object.assign({id:s.id},s.data()));render();if(state.openId)renderClients()},()=>{});
  }).catch(useLocal);
}else useLocal();
})();
</script>
