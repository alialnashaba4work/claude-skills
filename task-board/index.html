function noiseBuf(ctx,brown){const b=ctx.createBuffer(1,ctx.sampleRate*3,ctx.sampleRate),d=b.getChannelData(0);let last=0;
  for(let i=0;i<d.length;i++){const w=Math.random()*2-1;if(brown){last=(last+.02*w)/1.02;d[i]=last*3.5}else d[i]=w}return b}
function loop(buf,dest,filters,gain){const c=sound.ctx,src=c.createBufferSource();src.buffer=buf;src.loop=true;let node=src;
  for(const [type,f,q] of filters){const fl=c.createBiquadFilter();fl.type=type;fl.frequency.value=f;fl.Q.value=q;node.connect(fl);node=fl}
  const g=c.createGain();g.gain.value=0;node.connect(g).connect(dest);src.start(0,Math.random()*2);g.gain.linearRampToValueAtTime(gain,c.currentTime+2);return{src,g}}
// rain: a deep steady body, a soft high hiss, slow swells, and single drops landing at random
function startRain(){
  const c=sound.ctx,L=sound.layers;if(L.rainBody)return;
  L.rainBody=loop(sound.brown,sound.rainBus,[['lowpass',1100,.4]],.55);
  L.rainHiss=loop(sound.noise,sound.rainBus,[['highpass',2800,.3],['lowpass',9000,.3]],.09);
  const lfo=c.createOscillator(),lg=c.createGain();lfo.frequency.value=.06;lg.gain.value=.12;lfo.connect(lg).connect(L.rainBody.g.gain);lfo.start();L.rainLfo={src:lfo,g:lg};
  const drop=()=>{const t=c.currentTime,src=c.createBufferSource();src.buffer=sound.noise;const bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1800+Math.random()*4200;bp.Q.value=6+Math.random()*8;
    const g=c.createGain(),peak=.03+Math.random()*.09;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(peak,t+.004);g.gain.exponentialRampToValueAtTime(.0001,t+.05+Math.random()*.06);
    src.connect(bp).connect(g).connect(sound.rainBus);src.start(t,Math.random()*2,.12)};
  const tick=()=>{if(!sound.on)return;const n=1+Math.floor(Math.random()*3);for(let i=0;i<n;i++)setTimeout(drop,Math.random()*60);sound.dropTimer=setTimeout(tick,35+Math.random()*60)};tick();
}
function chirp(){const c=sound.ctx,t=c.currentTime,notes=2+Math.floor(Math.random()*3),base=2600+Math.random()*1400;
  for(let i=0;i<notes;i++){const o=c.createOscillator(),g=c.createGain(),s0=t+i*.13;o.type='sine';o.frequency.setValueAtTime(base,s0);o.frequency.exponentialRampToValueAtTime(base*1.5,s0+.05);o.frequency.exponentialRampToValueAtTime(base*.9,s0+.1);
    g.gain.setValueAtTime(0,s0);g.gain.linearRampToValueAtTime(.06,s0+.02);g.gain.exponentialRampToValueAtTime(.0005,s0+.11);o.connect(g).connect(sound.birdBus);o.start(s0);o.stop(s0+.12)}}
function cricket(){const c=sound.ctx,t=c.currentTime;for(let i=0;i<3;i++){const o=c.createOscillator(),g=c.createGain(),s0=t+i*.07;o.frequency.value=4300;g.gain.setValueAtTime(0,s0);g.gain.linearRampToValueAtTime(.022,s0+.01);g.gain.linearRampToValueAtTime(0,s0+.045);o.connect(g).connect(sound.birdBus);o.start(s0);o.stop(s0+.05)}}
function stopLayers(){const c=sound.ctx;for(const k in sound.layers){const l=sound.layers[k];try{if(l.g)l.g.gain.linearRampToValueAtTime(0,c.currentTime+.8);l.src.stop(c.currentTime+.9)}catch(e){}}sound.layers={};clearTimeout(sound.timer);clearTimeout(sound.dropTimer)}
function applyVolumes(){if(!sound.ctx)return;const t=sound.ctx.currentTime;sound.rainBus.gain.setTargetAtTime(volCurve(sound.vol.rain),t,.15);sound.birdBus.gain.setTargetAtTime(volCurve(sound.vol.birds),t,.15)}
// rain plays whenever its slider is up; wind joins in the desert; birds by day, crickets at night
function updateSound(){
  if(!sound.on||!sound.ctx)return;
  const night=periodOf(new Date().getHours())==='night',w=weatherNow(),mode=w+'|'+night;
  if(mode===sound.mode)return;sound.mode=mode;stopLayers();

function makeZoomer(host,S,dims,save,lim,svgHost=host){

    if(host.id==='g-scene')host.style.position='relative';host.append(el);setTimeout(()=>el.remove(),1600)}
}
function pickPlant(from,to){
  if(document.getElementById('pick'))return;
  const opts=[['palm','نخلة'],['tree','شجرة ظل'],['flower','زهور']];
  const icon=k=>{const s0=plantSVG(k==='palm'?9:k==='tree'?24:1,{x:32,y:62,v:.3});return `<svg viewBox="0 0 64 70" aria-hidden="true"><defs>${gardenDefs(skyFor('day'),false)}</defs>${s0.replace(/scale\([^)]*\)/,k==='tree'?'scale(.72)':'scale(1.15)')}</svg>`};
  const sc=document.createElement('div');sc.id='pick-scrim';
  const box=document.createElement('div');box.className='pick';box.id='pick';box.setAttribute('role','dialog');box.setAttribute('aria-label','اختر زرعتك');
  box.innerHTML=`<h3>وش تبي تزرع؟ 🌱</h3><p>خلّصت مهمة كبيرة، اختر نوع الزرعات الثلاث</p><div class="pick-row"></div><button class="later" type="button">خلها مفاجأة</button>`;
  const row=box.querySelector('.pick-row');
  const close=()=>{sc.remove();box.remove()};
  for(const [k,name] of opts){const b=document.createElement('button');b.type='button';b.innerHTML=icon(k)+`<span>${name}</span>`;
    b.onclick=()=>{state.garden.picks=Object.assign({},state.garden.picks||{});for(let i=from;i<to;i++)state.garden.picks[i]=k;saveGarden();close();lastPeriod=null;bannerN=from;renderSky();if(!$('gview').hidden)renderGarden(false);toast(`انزرعت ${name==='زهور'?'زهور':name} في حديقتك 🌱`)};row.append(b)}
  box.querySelector('.later').onclick=close;sc.onclick=close;
  document.body.append(sc,box);row.querySelector('button').focus();
}
function plusBubble(w,d){const el=document.createElement('span');el.className='plus';el.textContent=`+${w} 🌱`+(d?`  +${d} 🌴`:'');$('hello').append(el);setTimeout(()=>el.remove(),2000)}
function renderSky(){
  const h=new Date().getHours(),per=periodOf(h);
  renderQuote();
  const n=gardenCount(),palms=palmCount(),key=per+'|'+n+'|'+palms+'|'+farmerPhase+'|'+(state.garden.tidyCount||0)+'|'+weatherNow()+'|'+openCount()+'|'+Math.floor(Date.now()/6e5)+'|'+JSON.stringify(state.garden.picks||{}).length;
  if(key===lastPeriod)return;lastPeriod=key;
  const from=bannerN===null||n<bannerN?n:bannerN;bannerN=n;
  {const w=weatherNow(),pill=$('wx-pill');const dn=dryNote();pill.hidden=!dn&&w!=='spring';pill.textContent=[dn?(dryLevel()>=0.5?'🏜️ ':'🌵 ')+dn:w==='spring'?'🌧️ ربيع: الجو في أحسن حالاته':''].filter(Boolean).join(' · ')}
  updateSound();
  const el=$('hello');el.classList.remove('sky-dawn','sky-day','sky-sunset','sky-night');el.classList.add('sky-'+per);
  // the banner shows your garden as it is now, cropped to the fence, house and plants
  // mirrored and shifted so the house and plants sit between the greeting (right) and the streak card (left)
  const full=gardenSVG(n,palms,from,from<n,true).replace(/id="g([sgrd])"/g,'id="b$1"').replace(/url\(#g([sgrd])\)/g,'url(#b$1)');
  // empty garden: put the shoot in the middle of the banner
  const inner=full.slice(full.indexOf('>')+1,full.lastIndexOf('</svg>'))
    // bring the sun, clouds and moon down into the banner's sky
;
  $('sky-deco').innerHTML=`<svg viewBox="0 0 1000 340" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><g>${inner}</g></svg>`;
  if(!bannerZoom)bannerZoom=makeZoomer($('hello'),BV,bannerDims,saveBV,[-300,1300,-40,640],$('sky-deco'));
  bannerZoom.apply();
}
setInterval(()=>{renderSky();renderStreak()},10*60*1000);

// move the task to another section
function renderWsPick(){
  const t=cur();if(!t)return;const wrap=$('f-ws');wrap.replaceChildren();
  for(const w in WS){const b=document.createElement('button');b.type='button';b.textContent=WS[w];b.setAttribute('aria-pressed',String((t.workspace||'freelance')===w));
    b.onclick=()=>{if((t.workspace||'freelance')===w)return;t.workspace=w;t.client=t.client||'';persist(t);$('d-ws').textContent=WS[w];renderWsPick();renderClients();render();toast(`انتقلت المهمة إلى ${WS[w]}`)};wrap.append(b)}
}
function renderType(){
  const t=cur(),wrap=$('f-type');wrap.replaceChildren();
  const sel=typesOf(t);
  for(const k of TYPES){const b=document.createElement('button');b.textContent=k;b.className='tc';b.style.setProperty('--c',TYPE_COLORS[k]||'#9A9A9A');b.setAttribute('aria-pressed',String(sel.includes(k)));
    b.onclick=()=>{const cur=typesOf(t);const next=cur.includes(k)?cur.filter(x=>x!==k):cur.concat(k);
      t.types=TYPES.filter(x=>next.includes(x));delete t.type;persist(t);renderType();render()};wrap.append(b)}
}
function renderStatus(){
  const t=cur(),b=$('f-complete'),done=t.status==='done';
  b.className='btn '+(done?'btn-ghost':'btn-accent');
  b.innerHTML=done?'إرجاع إلى المهام':checkSvg.replace('<svg','<svg width="16" height="16"')+'اكتملت';
}
$('f-complete').onclick=()=>{const t=cur();if(!t)return;flush();const finishing=t.status!=='done';
  if(finishing){t.status='done';t.completedAt=Date.now()}else{t.status='todo';delete t.completedAt}
  persist(t);closeTask();celebrate(finishing,t)};
function renderChecks(){
  const t=cur(),wrap=$('f-checks');wrap.replaceChildren();
  if(!Array.isArray(t.checklist))t.checklist=[];
  t.checklist.forEach((c,i)=>{
    const row=document.createElement('div');row.className='chk'+(c.done?' done':'');
    const cb=document.createElement('input');cb.type='checkbox';cb.checked=!!c.done;cb.id='chk-'+i;cb.setAttribute('aria-label','تم');
    cb.onchange=()=>{const lt=cur()||t,lc=(lt.checklist||[])[i]||c;lc.done=cb.checked;persist(lt);renderChecks();render()};
    // clicking anywhere on the row (not the text or the ×) ticks the step
    row.addEventListener('click',e=>{if(e.target===row){cb.checked=!cb.checked;cb.onchange()}});
    const tx=document.createElement('input');tx.type='text';tx.value=c.text||'';tx.id='chkt-'+i;tx.setAttribute('aria-label','الخطوة');
    tx.oninput=()=>{c.text=tx.value;schedule()};
    const x=document.createElement('button');x.className='x';x.textContent='×';x.setAttribute('aria-label','حذف الخطوة');
    x.onclick=()=>{t.checklist.splice(i,1);persist(t);renderChecks();render()};
    row.append(cb,tx,x);wrap.append(row);
  });
}
function addCheck(){const v=$('f-newchk').value.trim();const t=cur();if(!v||!t)return;t.checklist=(t.checklist||[]).concat({text:v,done:false});$('f-newchk').value='';persist(t);renderChecks();render()}
$('f-addchk').onclick=addCheck;
$('f-newchk').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addCheck()}});
let delArmed=false,delTimer;
function resetDelete(){delArmed=false;clearTimeout(delTimer);$('d-delete').textContent='حذف المهمة'}
$('d-delete').onclick=()=>{
  if(!delArmed){delArmed=true;$('d-delete').textContent='اضغط مرة ثانية للتأكيد';delTimer=setTimeout(resetDelete,3500);return}
  const id=state.openId,assetIds=attsOf(cur()||{}).map(a=>a.id);clearTimeout(saveTimer);saveTimer=null;state.openId=null;$('scrim').hidden=true;$('drawer').hidden=true;remove(id);toast('تم حذف المهمة');
  if(assets)(async()=>{for(const a of assetIds){try{await assets.delete(a)}catch(e){}}})();
};
$('d-close').onclick=closeTask;$('scrim').onclick=closeTask;
// save now and close (changes also save on their own while typing)
$('d-save').onclick=()=>{const t=cur();if(!t)return;clearTimeout(saveTimer);saveTimer=null;persist(t);draftDirty=false;closeTask();toast('تم حفظ المهمة')};
// copy a task: same details and steps (unticked), no due date or attachments, opens the copy
$('d-copy').onclick=()=>{
  const t=cur();if(!t)return;flush();
  const c=JSON.parse(JSON.stringify(t));
  Object.assign(c,{id:newId(),title:(t.title||'بدون عنوان')+' (نسخة)',status:'todo',due:'',attachments:[],createdAt:Date.now(),checklist:(t.checklist||[]).map(x=>({text:x.text,done:false}))});
  delete c.completedAt;delete c.clientAuto;
  state.tasks.push(c);persist(c);closeTask();openTask(c.id,true);toast('انعملت نسخة من المهمة');
};
document.addEventListener('keydown',e=>{
  const typing=/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement&&document.activeElement.tagName)||(document.activeElement&&document.activeElement.isContentEditable);
  if(!typing&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&$('drawer').hidden&&$('gview').hidden){
    if(e.code==='KeyN'){e.preventDefault();createTask('todo');return}
    if(e.code==='Slash'){e.preventDefault();$('q').focus();return}
  }
  if(e.key!=='Escape')return;if(!$('gview').hidden)closeGarden();else if(state.openId)closeTask()});

/* ---------- top controls ---------- */
for(const w in WS)$('ws-'+w).onclick=()=>{state.ws=w;state.client='';state.showDone=false;try{localStorage.setItem('tb-ws',w)}catch(e){}render()};
/* ---------- light / night mode ---------- */
function themeNow(){const a=document.documentElement.getAttribute('data-theme');if(a==='dark'||a==='light')return a;return matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}
function showTheme(){const t=themeNow();$('th-light').setAttribute('aria-pressed',String(t==='light'));$('th-dark').setAttribute('aria-pressed',String(t==='dark'))}
function setTheme(t){document.documentElement.setAttribute('data-theme',t);try{localStorage.setItem('tb-theme',t)}catch(e){}showTheme()}
try{const saved=localStorage.getItem('tb-theme');if(saved==='dark'||saved==='light')document.documentElement.setAttribute('data-theme',saved)}catch(e){}
showTheme();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',showTheme);
$('th-light').onclick=()=>setTheme('light');$('th-dark').onclick=()=>setTheme('dark');
/* badges shelf: open or closed, remembered per browser */
function setShelf(open){$('medals').hidden=!open;$('shelf-toggle').setAttribute('aria-expanded',String(open));try{localStorage.setItem('tb-shelf',open?'1':'0')}catch(e){}}
try{if(localStorage.getItem('tb-shelf')==='1'){$('medals').hidden=false;$('shelf-toggle').setAttribute('aria-expanded','true')}}catch(e){}
$('shelf-toggle').onclick=()=>setShelf($('medals').hidden);
$('snd').onclick=e=>{e.stopPropagation();toggleSound()};
for(const k of ['rain','birds'])$('vol-'+k).addEventListener('input',e=>{sound.vol[k]=+e.target.value;$('vol-'+k+'-v').textContent=sound.vol[k]+'%';applyVolumes();try{localStorage.setItem('tb-sound',JSON.stringify(sound.vol))}catch(err){}});
$('snd-toggle').onclick=async()=>{if(sound.on){soundOff();toast('طفّيت الأصوات')}else await soundOn();syncSoundUI()};
$('snd-panel').addEventListener('click',e=>e.stopPropagation());
document.addEventListener('click',()=>{$('snd-panel').hidden=true});
syncSoundUI();
// drag the handle under the garden: down = taller, up = shorter (remembered)
{const hello=$('hello'),h=$('resize-h'),MIN=150,MAX=()=>Math.max(320,Math.round(innerHeight*0.85));
  const apply=v=>{v=Math.round(Math.max(MIN,Math.min(MAX(),v)));hello.style.minHeight=v+'px';hello.style.height=v+'px';return v};
  try{const v=parseInt(localStorage.getItem('tb-bannerH'),10);if(v)apply(v)}catch(e){}
  const save=v=>{try{localStorage.setItem('tb-bannerH',String(v))}catch(e){}};
  let y0=0,h0=0,cur=0;
  h.addEventListener('pointerdown',e=>{e.preventDefault();y0=e.clientY;h0=hello.getBoundingClientRect().height;h.setPointerCapture(e.pointerId);h.classList.add('dragging');document.body.classList.add('resizing')});
  h.addEventListener('pointermove',e=>{if(!h.classList.contains('dragging'))return;cur=apply(h0+(e.clientY-y0))});
  const end=()=>{if(!h.classList.contains('dragging'))return;h.classList.remove('dragging');document.body.classList.remove('resizing');if(cur)save(cur)};
  h.addEventListener('pointerup',end);h.addEventListener('pointercancel',end);
  h.addEventListener('keydown',e=>{if(e.key!=='ArrowDown'&&e.key!=='ArrowUp')return;e.preventDefault();save(apply(hello.getBoundingClientRect().height+(e.key==='ArrowDown'?24:-24)))});
  h.addEventListener('dblclick',()=>{hello.style.minHeight='';hello.style.height='';try{localStorage.removeItem('tb-bannerH')}catch(e){}});
}
// full screen where the browser allows it; iPhone Safari only allows it for videos
$('fs-btn').onclick=async()=>{const d=document,el=d.documentElement,fsEl=d.fullscreenElement||d.webkitFullscreenElement;
  try{if(fsEl){await(d.exitFullscreen||d.webkitExitFullscreen).call(d);return}
    const req=el.requestFullscreen||el.webkitRequestFullscreen;if(!req)throw 0;await req.call(el)}
  catch(e){toast(/iPhone|iPad|iPod/.test(navigator.userAgent)?'الآيفون ما يسمح بالشاشة الكاملة للصفحات. افتحها من اختصار الشاشة الرئيسية وتطلع أكبر':'الشاشة الكاملة مو متاحة هنا. جرّب تفتح اللوحة في المتصفح مباشرة')}};$('z-in').onclick=()=>setZoom(1);$('z-out').onclick=()=>setZoom(-1);showZoom();
$('new-top').onclick=()=>createTask('todo');
$('done-toggle').onclick=()=>{state.showDone=!state.showDone;render()};
$('q').addEventListener('input',e=>{state.q=e.target.value;render()});
$('client-filter').addEventListener('change',e=>{state.client=e.target.value;render()});
$('type-filter').addEventListener('change',e=>{state.type=e.target.value;render()});

render();
if(window.claude&&typeof window.claude.use==='function'){
  window.claude.use('assets').then(a=>{assets=a||null;if(state.openId)renderAtts()}).catch(()=>{});
  window.claude.use('db').then(d=>{
    if(!d){useLocal();return}
    db=d;mode='db';$('store-note').textContent='';
    db.collection('tasks').onSnapshot(snap=>{
      // merge, don't replace: a snapshot can lag behind this page's own writes
      const map=new Map(snap.docs.map(s=>[s.id,Object.assign({id:s.id},s.data())]));
      for(const t of state.tasks){
        const inc=map.get(t.id);
        const keepLocal=inFlight.has(t.id)||(t.id===state.openId&&(draftDirty||saveTimer))||(inc&&(t.updatedAt||0)>(inc.updatedAt||0));
        if(keepLocal)map.set(t.id,t);
      }
      for(const id of deletedIds)map.delete(id);
      state.tasks=[...map.values()];render();
    },()=>{toast('انقطع الاتصال بقاعدة البيانات');});
    db.doc('meta/garden').onSnapshot(snap=>{const d=snap.exists&&snap.data();state.garden=Object.assign({count:0,seen:0},d||{});if(!gardenLoaded){gardenLoaded=true;setTimeout(checkFarmer,1500);setTimeout(()=>{checkWorker();townTick()},5000)}renderGardenBtn();if(!$('gview').hidden)renderGarden(false)},()=>{});
    db.doc('meta/badges').onSnapshot(snap=>{const d=snap.exists&&snap.data();state.badges=d&&d.weeks&&typeof d.weeks==='object'?d.weeks:{};renderMedals()},()=>{});
    db.doc('meta/days').onSnapshot(snap=>{const d=snap.exists&&snap.data();state.days=d&&Array.isArray(d.days)?d.days:[];renderStreak()},()=>{});
    db.collection('clients').onSnapshot(snap=>{const inc=snap.docs.map(s=>Object.assign({id:s.id},s.data()));const ids=new Set(inc.map(c=>c.id));
      // keep clients added in the last few seconds that the snapshot has not caught up with
      state.clients=inc.concat(state.clients.filter(c=>!ids.has(c.id)&&c.createdAt&&Date.now()-c.createdAt<15000));render();if(state.openId)renderClients()},()=>{});
  }).catch(useLocal);
}else useLocal();
})();
</script>
