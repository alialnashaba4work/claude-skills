<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ديوان السيد محمد الماجد</title>
<meta name="description" content="لوحة تصفّح وإدارة قصائد خادم أهل البيت السيد محمد الماجد: مدح، رثاء، مناجاة، ومجالس كاملة.">
<style>
@font-face{font-family:"Thmanyah Serif Text";src:url("fonts/thmanyah-serif-text-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Thmanyah Serif Text";src:url("fonts/thmanyah-serif-text-Medium.woff2") format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Thmanyah Serif Text";src:url("fonts/thmanyah-serif-text-Bold.woff2") format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Thmanyah Serif Display";src:url("fonts/thmanyah-serif-display-Medium.woff2") format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Thmanyah Serif Display";src:url("fonts/thmanyah-serif-display-Bold.woff2") format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Thmanyah Serif Display";src:url("fonts/thmanyah-serif-display-Black.woff2") format("woff2");font-weight:900;font-display:swap}

:root{
  --bg:#FAF8F4; --side:#F4F1EA; --line:#E6E1D7;
  --ink:#1A1814; --ink-2:#6B655A; --ink-3:#A39C8E;
  --accent:#1E4A3B; --gold:#8C6A2F; --danger:#A33A3A;
  --serif:"Thmanyah Serif Text","Amiri","Noto Naskh Arabic",serif;
  --display:"Thmanyah Serif Display","Thmanyah Serif Text","Amiri",serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#121110;--side:#171614;--line:#2A2724;--ink:#ECE7DD;--ink-2:#A39C8E;--ink-3:#6B655A;--accent:#7FB89C;--gold:#C9A766;--danger:#E08585;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#121110;--side:#171614;--line:#2A2724;--ink:#ECE7DD;--ink-2:#A39C8E;--ink-3:#6B655A;--accent:#7FB89C;--gold:#C9A766;--danger:#E08585;color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--serif);font-size:17px;line-height:1.75;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.scrim{display:none}
.side{position:sticky;top:0;height:100vh;background:var(--side);border-inline-end:1px solid var(--line);padding:32px 22px;display:flex;flex-direction:column;gap:28px;overflow:auto}
.brand small{display:block;color:var(--gold);font-size:13px}
.brand h1{font-family:var(--display);font-weight:900;font-size:25px;line-height:1.3;margin:4px 0 0}
.nav{display:flex;flex-direction:column}
.nav a{display:flex;justify-content:space-between;gap:10px;padding:7px 0;color:var(--ink-2)}
.nav a:hover{color:var(--ink)}
.nav a[aria-current="page"]{color:var(--ink);font-weight:700}
.nav a[aria-current="page"] span:first-child::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--gold);margin-inline-end:8px;vertical-align:middle}
.nav a .n{font-size:14px;color:var(--ink-3);font-weight:400}
.nav .sep{height:1px;background:var(--line);margin:10px 0}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:2px;font-size:14px}
.side-foot button{background:none;border:0;text-align:start;padding:4px 0;color:var(--ink-3);cursor:pointer}
.side-foot button:hover{color:var(--ink)}

main{padding:32px clamp(16px,4vw,56px) 70px;min-width:0}
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:34px}
.top h2{font-family:var(--display);font-weight:900;font-size:32px;margin:0;flex:1 1 auto}
.search{position:relative;flex:0 1 300px}
.search input{width:100%;padding:8px 26px 8px 0;border:0;border-bottom:1px solid var(--line);background:none;outline:none}
.search input:focus{border-color:var(--ink)}
.search svg{position:absolute;inset-inline-start:0;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 18px;border:0;background:var(--ink);color:var(--bg);cursor:pointer;font-weight:500;white-space:nowrap;border-radius:6px}
.btn:hover{opacity:.85}
.link{background:none;border:0;padding:0;cursor:pointer;color:var(--ink-2);text-decoration:underline;text-underline-offset:5px;text-decoration-color:var(--line)}
.link:hover{color:var(--ink);text-decoration-color:currentColor}
.link.danger{color:var(--danger)}
.menu-btn{display:none;background:none;border:0;font-size:22px;cursor:pointer;padding:0}

.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:24px 20px;padding-bottom:30px;margin-bottom:34px;border-bottom:1px solid var(--line)}
.stat{display:block}
.stat .v{font-family:var(--display);font-weight:900;font-size:44px;line-height:1.1}
.stat .k{color:var(--ink-2);font-size:15px}
.stat:hover .k{color:var(--ink)}
.stat.total .v{color:var(--accent)}
.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:30px 44px;margin-bottom:44px}
.panel h3,.section-title{font-size:14px;font-weight:500;color:var(--ink-3);margin:0 0 12px}
.bar{display:grid;grid-template-columns:minmax(80px,auto) 1fr 24px;align-items:center;gap:12px;padding:4px 0;font-size:15px;cursor:pointer}
.bar:hover .lbl{color:var(--accent)}
.bar .track{height:2px;background:var(--line)}
.bar .fill{display:block;height:100%;background:var(--gold)}
.bar .num{text-align:end;color:var(--ink-3)}

.filters{display:flex;flex-wrap:wrap;gap:12px 34px;padding-bottom:18px;margin-bottom:18px;border-bottom:1px solid var(--line);font-size:15px}
.fgroup{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px}
.fgroup > span{color:var(--ink-3)}
.chips{display:contents}
.chip{background:none;border:0;padding:0;cursor:pointer;color:var(--ink-3)}
.chip:hover{color:var(--ink)}
.chip[aria-pressed="true"]{color:var(--ink);text-decoration:underline;text-underline-offset:6px;text-decoration-color:var(--gold)}
.fgroup select{border:0;background:none;padding:0;color:var(--ink);cursor:pointer;max-width:220px}
.result-meta{color:var(--ink-3);font-size:14px;margin:0 0 6px}
.result-meta a{color:var(--ink-2);text-decoration:underline;text-underline-offset:4px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:0 40px}
.card{padding:22px 0;border-top:1px solid var(--line);cursor:pointer;display:flex;flex-direction:column;gap:6px}
.card:focus-visible{outline:1px solid var(--ink);outline-offset:4px}
.card .sec{font-size:13px;color:var(--gold)}
.card h4{font-family:var(--display);font-weight:700;font-size:21px;line-height:1.4;margin:0;transition:color .15s}
.card:hover h4{color:var(--accent)}
.card .excerpt{color:var(--ink-2);font-size:16px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .foot{font-size:13px;color:var(--ink-3)}
.card .foot .m{color:var(--accent)}
.empty{padding:60px 0;text-align:center;color:var(--ink-3)}

dialog{border:0;padding:0;background:transparent;max-width:min(820px,calc(100vw - 24px));width:100%;max-height:calc(100vh - 24px)}
dialog::backdrop{background:rgba(15,12,8,.45)}
.sheet{background:var(--bg);color:var(--ink);border-radius:8px;overflow:auto;max-height:calc(100vh - 24px)}
.sheet-head{position:sticky;top:0;background:var(--bg);display:flex;align-items:flex-start;gap:12px;padding:26px 30px 16px;border-bottom:1px solid var(--line);z-index:1}
.sheet-head .t{flex:1}
.sheet-head h3{font-family:var(--display);font-weight:900;font-size:clamp(24px,4vw,32px);margin:0;line-height:1.35}
.sheet-head .sub{color:var(--ink-3);font-size:14px}
.x{border:0;background:none;cursor:pointer;font-size:26px;line-height:1;color:var(--ink-3);padding:0}
.x:hover{color:var(--ink)}
.sheet-body{padding:24px 30px 30px}
.meta-row{color:var(--ink-3);font-size:14px;margin-bottom:24px}

.poem{margin:8px 0 26px;font-size:clamp(18px,2.4vw,21px);line-height:2.15}
.poem .bayt{display:grid;grid-template-columns:1fr 1fr;gap:0 clamp(18px,5vw,56px);padding:3px 0}
.poem .bayt span{text-align:center}
.poem .line{text-align:center}
.poem .part{color:var(--gold);text-align:center;margin:24px 0 6px;font-size:.85em}
.poem .part:first-child{margin-top:0}
.notes{color:var(--ink-2);font-size:15px;margin-bottom:22px}
.media{display:flex;flex-direction:column;gap:18px}
.media h5{font-size:14px;font-weight:500;color:var(--ink-3);margin:0 0 6px}
.embed{position:relative;aspect-ratio:16/9;background:#000}
.embed iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.media audio,.media video{width:100%}
.sheet-actions{display:flex;gap:10px 24px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);padding-top:18px;margin-top:26px;font-size:15px}

.form{display:grid;grid-template-columns:1fr 1fr;gap:22px 26px}
.form .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:4px}
.field > label,.field > .lab{font-size:14px;color:var(--ink-3)}
.field input,.field select,.field textarea{border:0;border-bottom:1px solid var(--line);background:none;padding:6px 0;outline:none;width:100%;border-radius:0}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--ink)}
.field textarea{min-height:220px;line-height:2;resize:vertical;border:1px solid var(--line);padding:10px 12px}
.hint{font-size:13px;color:var(--ink-3)}
.persona-pick{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:15px;padding:4px 0}
.persona-pick label{display:inline-flex;align-items:center;gap:6px;cursor:pointer;color:var(--ink-2)}
.persona-pick label:has(input:checked){color:var(--ink)}
.persona-pick input{accent-color:var(--accent);margin:0}
.media-rows{display:flex;flex-direction:column;gap:10px}
.media-row{display:grid;grid-template-columns:90px 1fr 1fr 24px;gap:14px;align-items:end}
.media-row select,.media-row input{border:0;border-bottom:1px solid var(--line);background:none;padding:6px 0;outline:none;min-width:0}
.media-row button{background:none;border:0;cursor:pointer;color:var(--ink-3);font-size:20px;padding:0}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 18px;border-radius:6px;font-size:15px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:60}
.toast.on{opacity:1}

@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset-block:0;inset-inline-start:0;width:270px;z-index:40;transform:translateX(100%);transition:transform .25s}
  .side.open{transform:none}
  .menu-btn{display:inline-block}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:39}
  .scrim.on{display:block}
  .top h2{font-size:26px}
  .search{flex:1 1 100%;order:3}
  .form{grid-template-columns:1fr}
  .media-row{grid-template-columns:1fr 24px}
  .media-row select,.media-row input{grid-column:1}
  .media-row button{grid-column:2;grid-row:1}
}
@media (max-width:520px){
  .poem .bayt{grid-template-columns:1fr;padding:6px 0}
  .sheet-head,.sheet-body{padding-inline:18px}
  .stat .v{font-size:36px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand">
      <small>خادم أهل البيت عليهم السلام</small>
      <h1>السيد محمد الماجد</h1>
    </div>
    <nav class="nav" id="nav" aria-label="الأقسام"></nav>
    <div class="side-foot">
      <button type="button" id="exportBtn">تصدير البيانات</button>
      <button type="button" id="importBtn">استيراد ملف</button>
      <button type="button" id="resetBtn">استعادة البيانات الأصلية</button>
      <button type="button" id="themeBtn">تبديل المظهر</button>
      <input type="file" id="importFile" accept=".json,.js,application/json,text/javascript" hidden>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main>
    <div class="top">
      <button class="menu-btn" id="menuBtn" aria-label="القائمة">☰</button>
      <h2 id="viewTitle">نظرة عامة</h2>
      <label class="search">
        <span class="sr">بحث</span>
        <input type="search" id="q" placeholder="ابحث في العناوين والأبيات…">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </label>
      <button class="btn" id="addBtn">إضافة قصيدة</button>
    </div>
    <div id="view"></div>
  </main>
</div>

<dialog id="reader"><div class="sheet" id="readerSheet"></div></dialog>
<dialog id="editor"><div class="sheet" id="editorSheet"></div></dialog>
<div class="toast" id="toast" role="status"></div>

<script src="data.js"></script>
<script>
(() => {
"use strict";

/* ===== taxonomy ===== */
const SECTIONS = [
  { id: "madh",    label: "أبيات مدح" },
  { id: "ritha",   label: "أبيات رثاء" },
  { id: "munajat", label: "أبيات مناجاة" },
  { id: "other",   label: "أخرى" },
  { id: "majlis",  label: "مجالس كاملة" }
];
const DIALECTS = [
  { id: "fusha",  label: "فصيح" },
  { id: "shaabi", label: "شعبي" }
];
const FORMS = [
  { id: "amudi",   label: "عمودي" },
  { id: "majarid", label: "مجاريد" },
  { id: "faizi",   label: "فايزي" },
  { id: "hur",     label: "حر" },
  { id: "other",   label: "أخرى" }
];
const PERSONAS = [
  "الرسول الأعظم (ص)", "الإمام علي (ع)", "السيدة فاطمة الزهراء (ع)", "الإمام الحسن (ع)",
  "الإمام الحسين (ع)", "الإمام زين العابدين (ع)", "الإمام الباقر (ع)", "الإمام الصادق (ع)",
  "الإمام الكاظم (ع)", "الإمام الرضا (ع)", "الإمام الجواد (ع)", "الإمام الهادي (ع)",
  "الإمام العسكري (ع)", "الإمام المهدي (عج)", "أبو الفضل العباس (ع)", "السيدة زينب (ع)",
  "علي الأكبر (ع)", "القاسم بن الحسن (ع)", "السيدة رقية (ع)", "أم البنين (ع)",
  "مسلم بن عقيل (ع)", "عامة"
];
const num = n => Number(n).toLocaleString("ar-EG");
const label = (list, id) => (list.find(x => x.id === id) || {}).label || id || "—";

/* ===== storage ===== */
const KEY = "majed-diwan-v1";
const store = {
  get(k){ try { return localStorage.getItem(k); } catch { return null; } },
  set(k,v){ try { localStorage.setItem(k,v); return true; } catch { return false; } },
  del(k){ try { localStorage.removeItem(k); } catch {} }
};
const seed = () => JSON.parse(JSON.stringify(window.POEMS_SEED || []));
let poems;
try { poems = JSON.parse(store.get(KEY)) || seed(); } catch { poems = seed(); }
const save = () => { if (!store.set(KEY, JSON.stringify(poems))) toast("تعذّر الحفظ في المتصفح — صدّر البيانات لحفظها"); };

/* ===== state ===== */
const state = { view: "home", q: "", dialect: "", form: "", persona: "", hasMedia: false };

/* ===== helpers ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const norm = s => String(s || "").replace(/[ً-ْـ]/g, "").replace(/[أإآ]/g, "ا").replace(/ة/g, "ه").replace(/ى/g, "ي").toLowerCase();
const mediaOf = p => (p.media || []).filter(m => m && m.url && m.url.trim());
const allPersonas = () => {
  const s = new Set(PERSONAS);
  poems.forEach(p => (p.persona || []).forEach(x => s.add(x)));
  return [...s];
};
function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("on"), 2400);
}

/* ===== filtering ===== */
function filtered(){
  const q = norm(state.q.trim());
  return poems.filter(p => {
    if (state.view !== "home" && state.view !== "all" && p.section !== state.view) return false;
    if (state.dialect && p.dialect !== state.dialect) return false;
    if (state.form && p.form !== state.form) return false;
    if (state.persona && !(p.persona || []).includes(state.persona)) return false;
    if (state.hasMedia && !mediaOf(p).length) return false;
    if (q && !norm([p.title, p.verses, p.occasion, (p.persona||[]).join(" ")].join(" ")).includes(q)) return false;
    return true;
  });
}

/* ===== nav ===== */
function renderNav(){
  const count = id => poems.filter(p => p.section === id).length;
  const item = (id, text, n) =>
    `<a href="#/${id}" ${state.view === id ? 'aria-current="page"' : ""}><span>${text}</span>${n != null ? `<span class="n">${num(n)}</span>` : ""}</a>`;
  $("#nav").innerHTML =
    item("home", "نظرة عامة") +
    item("all", "كل القصائد", poems.length) +
    '<div class="sep"></div>' +
    SECTIONS.map(s => item(s.id, s.label, count(s.id))).join("");
}

/* ===== views ===== */
function excerpt(p){
  const lines = String(p.verses || "").split("\n").map(l => l.trim()).filter(l => l && !/^—.*—$/.test(l));
  return lines.slice(0, 2).map(l => esc(l.replace(/\s*\|\s*/, "  ·  "))).join("<br>");
}
function card(p){
  const tags = [...(p.persona || []), label(DIALECTS, p.dialect), label(FORMS, p.form)].filter(Boolean).map(esc).join("  ·  ");
  return `<article class="card" tabindex="0" data-id="${esc(p.id)}">
    <div class="sec">${esc(label(SECTIONS, p.section))}${p.occasion ? " · " + esc(p.occasion) : ""}</div>
    <h4>${esc(p.title)}</h4>
    <div class="excerpt">${excerpt(p)}</div>
    <div class="foot">${tags}${mediaOf(p).length ? '  ·  <span class="m">إلقاء ▸</span>' : ""}</div>
  </article>`;
}
function chips(name, list){
  return `<div class="chips">` +
    `<button class="chip" data-f="${name}" data-v="" aria-pressed="${!state[name]}">الكل</button>` +
    list.map(x => `<button class="chip" data-f="${name}" data-v="${esc(x.id)}" aria-pressed="${state[name] === x.id}">${esc(x.label)}</button>`).join("") +
    `</div>`;
}
function filtersBar(){
  const used = new Set(poems.flatMap(p => p.persona || []));
  const personas = allPersonas().filter(x => used.has(x));
  return `<div class="filters">
    <div class="fgroup"><span>اللهجة</span>${chips("dialect", DIALECTS)}</div>
    <div class="fgroup"><span>النوع</span>${chips("form", FORMS)}</div>
    <div class="fgroup"><span>الشخصية</span>
      <select id="personaSel"><option value="">الكل</option>${personas.map(x => `<option ${state.persona === x ? "selected" : ""}>${esc(x)}</option>`).join("")}</select>
    </div>
    <div class="fgroup"><span>الإلقاء</span>
      <button class="chip" id="mediaChip" aria-pressed="${state.hasMedia}">فيه تسجيل فقط</button>
    </div>
  </div>`;
}
function listView(){
  const items = filtered();
  const active = state.dialect || state.form || state.persona || state.hasMedia || state.q;
  return filtersBar() +
    `<div class="result-meta">${num(items.length)} ${items.length === 1 ? "قصيدة" : "قصائد"}${active ? ' · <a href="#" id="clearF">مسح التصفية</a>' : ""}</div>` +
    (items.length
      ? `<div class="grid">${items.map(card).join("")}</div>`
      : `<div class="empty">لا توجد قصائد مطابقة.<br><button class="link" data-add>أضف قصيدة</button></div>`);
}
function bars(title, rows, filterKey){
  const max = Math.max(1, ...rows.map(r => r.n));
  return `<div class="panel"><h3>${title}</h3>${rows.map(r =>
    `<div class="bar" data-jump="${filterKey}" data-v="${esc(r.id)}"><span class="lbl">${esc(r.label)}</span><span class="track"><span class="fill" style="width:${(r.n / max) * 100}%"></span></span><span class="num">${num(r.n)}</span></div>`
  ).join("") || '<div class="hint">لا بيانات بعد</div>'}</div>`;
}
function homeView(){
  if (state.q) return listView();
  const by = (key, list) => list.map(x => ({ id: x.id, label: x.label, n: poems.filter(p => p[key] === x.id).length }));
  const personaRows = allPersonas()
    .map(x => ({ id: x, label: x, n: poems.filter(p => (p.persona || []).includes(x)).length }))
    .filter(r => r.n).sort((a, b) => b.n - a.n).slice(0, 10);
  const withMedia = poems.filter(p => mediaOf(p).length).length;
  const recent = poems.slice(-6).reverse();
  return `<div class="stats">
      <a class="stat total" href="#/all"><div class="k">مجموع القصائد</div><div class="v">${num(poems.length)}</div></a>
      ${SECTIONS.map(s => `<a class="stat" href="#/${s.id}"><div class="k">${s.label}</div><div class="v">${num(poems.filter(p => p.section === s.id).length)}</div></a>`).join("")}

    </div>

    ${recent.length ? `<div class="grid">${recent.map(card).join("")}</div>` : `<div class="empty">لا توجد قصائد بعد.</div>`}`;
}

/* ===== reader ===== */
function poemHTML(text){
  return String(text || "").split("\n").map(raw => {
    const l = raw.trim();
    if (!l) return "";
    if (/^—.*—$/.test(l)) return `<div class="part">${esc(l.replace(/^—\s*|\s*—$/g, ""))}</div>`;
    if (l.includes("|")) {
      const [a, ...b] = l.split("|");
      return `<div class="bayt"><span>${esc(a.trim())}</span><span>${esc(b.join("|").trim())}</span></div>`;
    }
    return `<div class="line">${esc(l)}</div>`;
  }).join("");
}
function ytId(url){
  const m = String(url).match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/))([\w-]{11})/);
  return m ? m[1] : null;
}
function mediaHTML(m){
  const url = m.url.trim(), lab = esc(m.label || (m.type === "audio" ? "تسجيل صوتي" : "تسجيل مرئي"));
  const id = ytId(url);
  if (id) return `<div><h5>${lab}</h5><div class="embed"><iframe src="https://www.youtube-nocookie.com/embed/${id}" title="${lab}" allow="accelerometer; encrypted-media; picture-in-picture" allowfullscreen loading="lazy"></iframe></div></div>`;
  if (/\.(mp3|m4a|ogg|wav|aac)(\?|$)/i.test(url)) return `<div><h5>${lab}</h5><audio controls preload="none" src="${esc(url)}"></audio></div>`;
  if (/\.(mp4|webm)(\?|$)/i.test(url)) return `<div><h5>${lab}</h5><video controls preload="none" src="${esc(url)}"></video></div>`;
  if (/^https?:\/\//i.test(url)) return `<div><a class="link" href="${esc(url)}" target="_blank" rel="noopener">${lab} ↗</a></div>`;
  return "";
}
function openReader(id){
  const p = poems.find(x => x.id === id); if (!p) return;
  const m = mediaOf(p);
  $("#readerSheet").innerHTML = `
    <div class="sheet-head">

    <div class="sheet-body">

      <div class="poem">${poemHTML(p.verses)}</div>
      ${p.notes ? `<div class="notes">${esc(p.notes)}</div>` : ""}
      ${m.length ? `<div class="media">${m.map(mediaHTML).join("")}</div>` : ""}
      <div class="sheet-actions">
        <button class="btn" data-pdf="${esc(p.id)}">تنزيل PDF</button>

function submitForm(form){
  const fd = new FormData(form);
  const persona = [...fd.getAll("persona"), ...String(fd.get("personaExtra") || "").split(/[,،]/).map(s => s.trim()).filter(Boolean)];
  const types = fd.getAll("mtype"), urls = fd.getAll("murl"), labels = fd.getAll("mlabel");
  const media = urls.map((u, i) => ({ type: types[i], url: String(u).trim(), label: String(labels[i]).trim() })).filter(m => m.url);
  const data = {
    title: String(fd.get("title")).trim(), section: fd.get("section"), dialect: fd.get("dialect"), form: fd.get("form"),
    occasion: String(fd.get("occasion")).trim(), year: String(fd.get("year")).trim(), notes: String(fd.get("notes")).trim(),
    verses: String(fd.get("verses")).replace(/\r/g, "").trim(), persona: [...new Set(persona)], media
  };
  const id = form.dataset.id;
  if (id) Object.assign(poems.find(p => p.id === id), data);
  else poems.push({ id: "p" + Date.now().toString(36), ...data });
  save(); $("#editor").close(); render(); toast("تم الحفظ");
}

function importData(text){

/* ===== PDF / Word ===== */
const LIBS = {
  jspdf: "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js",
  h2i:   "https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js",
  docx:  "https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"
};
const loaded = {};
const loadScript = src => loaded[src] || (loaded[src] = new Promise((res, rej) => {
  const el = document.createElement("script"); el.src = src; el.onload = res;
  el.onerror = () => { delete loaded[src]; rej(new Error("load")); };
  document.head.appendChild(el);
}));
const POET = "السيد محمد الماجد";
const fileName = (p, ext) => (String(p.title || "قصيدة").replace(/[\\/:*?"<>|]+/g, "").trim().slice(0, 80) || "قصيدة") + "." + ext;
const metaText = p => [label(SECTIONS, p.section), p.occasion, ...(p.persona || []), label(DIALECTS, p.dialect), label(FORMS, p.form)].filter(Boolean).join("  ·  ");
const parseLines = text => String(text || "").split("\n").map(l => l.trim()).filter(Boolean).map(l =>
  /^—.*—$/.test(l) ? { k: "part", t: l.replace(/^—\s*|\s*—$/g, "") }
  : l.includes("|") ? { k: "bayt", a: l.split("|")[0].trim(), b: l.split("|").slice(1).join("|").trim() }
  : { k: "line", t: l });

async function saveBlob(blob, name){
  if (downloadsApi) {
    try { await downloadsApi.save({ filename: name, data: blob }); toast("تم التنزيل"); }
    catch (e) { if (e && e.code !== "declined") toast("تعذّر التنزيل هنا"); }
    return;
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name; a.style.display = "none";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

async function buildPdf(p){
  await Promise.all([loadScript(LIBS.jspdf), loadScript(LIBS.h2i)]);
  await document.fonts.ready;
  const W = 794, H = 1123, PX = 80, PT = 84, PB = 96;
  const host = document.createElement("div");
  host.style.cssText = "position:fixed;top:0;left:-20000px;pointer-events:none";
  document.body.appendChild(host);
  const pageCss = `width:${W}px;height:${H}px;background:#fff;color:#1A1814;direction:rtl;font-family:${getComputedStyle(document.body).fontFamily};position:relative;overflow:hidden;padding:${PT}px ${PX}px ${PB}px;box-sizing:border-box`;
  const pages = [];
  const newPage = () => {
    const pg = document.createElement("div"); pg.style.cssText = pageCss;
    const body = document.createElement("div"); pg.appendChild(body);
    const foot = document.createElement("div");
    foot.style.cssText = "position:absolute;bottom:44px;left:0;right:0;text-align:center;font-size:12px;color:#A39C8E";
    pg.appendChild(foot); host.appendChild(pg); pages.push({ pg, body, foot }); return body;
  };
  const room = H - PT - PB;
  let body = newPage();
  const add = html => {
    const el = document.createElement("div"); el.innerHTML = html; const node = el.firstElementChild;
    body.appendChild(node);
    if (body.scrollHeight > room && body.children.length > 1) { node.remove(); body = newPage(); body.appendChild(node); }
  };
  add(`<div style="text-align:center;padding-bottom:30px">
    <div style="font-size:14px;color:#8C6A2F">خادم أهل البيت عليهم السلام · ${esc(POET)}</div>
    <div style="font-family:var(--display);font-weight:900;font-size:40px;line-height:1.3;margin:12px 0 10px">${esc(p.title)}</div>
    <div style="font-size:13px;color:#8A8376">${esc(metaText(p))}</div>
    <div style="color:#B5AE9F;letter-spacing:.6em;margin-top:22px">✦ ✦ ✦</div></div>`);
  parseLines(p.verses).forEach(l => {
    if (l.k === "part") add(`<div style="text-align:center;color:#8C6A2F;font-size:16px;padding:22px 0 6px">${esc(l.t)}</div>`);
    else if (l.k === "bayt") add(`<div style="display:grid;grid-template-columns:1fr 1fr;gap:0 48px;font-size:19px;line-height:2.2"><span style="text-align:center">${esc(l.a)}</span><span style="text-align:center">${esc(l.b)}</span></div>`);
    else add(`<div style="text-align:center;font-size:19px;line-height:2.2">${esc(l.t)}</div>`);
  });
  if (p.notes) add(`<div style="text-align:center;font-size:13px;color:#6B655A;padding-top:28px">${esc(p.notes)}</div>`);
  const links = mediaOf(p);
  if (links.length) add(`<div style="text-align:center;font-size:12px;color:#6B655A;padding-top:22px;direction:ltr">${links.map(m => esc(m.url)).join("<br>")}</div>`);
  pages.forEach((x, i) => { x.foot.textContent = pages.length > 1 ? `${POET}  ·  ${num(i + 1)} / ${num(pages.length)}` : POET; });
  try {
    const pdf = new window.jspdf.jsPDF({ unit: "mm", format: "a4" });
    for (let i = 0; i < pages.length; i++) {
      const png = await window.htmlToImage.toPng(pages[i].pg, { pixelRatio: 2, backgroundColor: "#ffffff", width: W, height: H });
      if (i) pdf.addPage();
      pdf.addImage(png, "PNG", 0, 0, 210, 297, undefined, "FAST");
    }
    pdf.setProperties({ title: p.title, author: POET });
    return pdf.output("blob");
  } finally { host.remove(); }
}

async function buildDocx(p){
  await loadScript(LIBS.docx);
  const D = window.docx;
  const F = "Thmanyah Serif Text";
  const font = { ascii: F, cs: F, hAnsi: F, eastAsia: F };
  const run = (text, o = {}) => new D.TextRun({ text, font, rightToLeft: true, size: o.size || 28, sizeComplexScript: o.size || 28,
    bold: !!o.bold, boldComplexScript: !!o.bold, color: o.color });
  const para = (runs, o = {}) => new D.Paragraph({ children: [].concat(runs), bidirectional: true,
    alignment: o.align || D.AlignmentType.CENTER, spacing: { before: o.before || 0, after: o.after ?? 120, line: o.line || 360 } });
  const none = { style: D.BorderStyle.NONE, size: 0, color: "FFFFFF" };
  const borders = { top: none, bottom: none, left: none, right: none, insideHorizontal: none, insideVertical: none };
  const kids = [
    para(run("خادم أهل البيت عليهم السلام · " + POET, { size: 20, color: "8C6A2F" })),
    para(run(p.title, { size: 48, bold: true }), { after: 80 }),
    para(run(metaText(p), { size: 18, color: "8A8376" }), { after: 200 }),
    para(run("✦ ✦ ✦", { size: 20, color: "B5AE9F" }), { after: 360 })
  ];
  parseLines(p.verses).forEach(l => {
    if (l.k === "part") kids.push(para(run(l.t, { size: 24, color: "8C6A2F", bold: true }), { before: 240, after: 120 }));
    else if (l.k === "bayt") kids.push(new D.Table({
      visuallyRightToLeft: true, borders, width: { size: 100, type: D.WidthType.PERCENTAGE },
      rows: [new D.TableRow({ cantSplit: true, children: [l.a, l.b].map(t => new D.TableCell({
        borders, width: { size: 50, type: D.WidthType.PERCENTAGE },
        children: [para(run(t), { after: 60 })] })) })]
    }));
    else kids.push(para(run(l.t)));
  });
  if (p.notes) kids.push(para(run(p.notes, { size: 20, color: "6B655A" }), { before: 400 }));
  mediaOf(p).forEach(m => kids.push(new D.Paragraph({ alignment: D.AlignmentType.CENTER,
    children: [new D.ExternalHyperlink({ link: m.url, children: [new D.TextRun({ text: (m.label || "رابط الإلقاء") + ": " + m.url, style: "Hyperlink", size: 18, font })] })] })));
  const doc = new D.Document({
    creator: POET, title: p.title,
    sections: [{ properties: { page: { margin: { top: 1300, bottom: 1300, left: 1300, right: 1300 } } }, children: kids }]
  });
  return D.Packer.toBlob(doc);
}

let busy = false;
async function downloadPoem(id, kind){
  const p = poems.find(x => x.id === id); if (!p || busy) return;
  busy = true; toast(kind === "pdf" ? "جارٍ تجهيز ملف PDF…" : "جارٍ تجهيز ملف Word…");
  try {
    const blob = kind === "pdf" ? await buildPdf(p) : await buildDocx(p);
    await saveBlob(blob, fileName(p, kind));
  } catch (e) {
    console.error(e); toast("تعذّر تجهيز الملف — تأكد من الاتصال بالإنترنت");
  } finally { busy = false; }
}

/* ===== events ===== */
document.addEventListener("click", e => {
  const t = e.target;
  const cardEl = t.closest(".card"); if (cardEl) return openReader(cardEl.dataset.id);
  const chip = t.closest(".chip[data-f]"); if (chip) { state[chip.dataset.f] = chip.dataset.v; return render(); }
  if (t.closest("#mediaChip")) { state.hasMedia = !state.hasMedia; return render(); }
  if (t.closest("#clearF")) { e.preventDefault(); Object.assign(state, { dialect: "", form: "", persona: "", hasMedia: false, q: "" }); $("#q").value = ""; return render(); }
  const bar = t.closest("[data-jump]");
  if (bar) { Object.assign(state, { dialect: "", form: "", persona: "", hasMedia: false }); state[bar.dataset.jump] = bar.dataset.v; location.hash = "#/all"; return render(); }
  if (t.closest("a[data-media]")) { Object.assign(state, { dialect: "", form: "", persona: "" }); state.hasMedia = true; }
  if (t.closest("[data-add]")) return openEditor();
  const pdfB = t.closest("[data-pdf]"); if (pdfB) return downloadPoem(pdfB.dataset.pdf, "pdf");
  const docB = t.closest("[data-docx]"); if (docB) return downloadPoem(docB.dataset.docx, "docx");
  const ed = t.closest("[data-edit]"); if (ed) { $("#reader").close(); return openEditor(ed.dataset.edit); }
  const cp = t.closest("[data-copy]");
  if (cp) { const p = poems.find(x => x.id === cp.dataset.copy);
    const txt = p.title + "\n\n" + p.verses.replace(/\s*\|\s*/g, "    ") + "\n\n— السيد محمد الماجد";
    navigator.clipboard?.writeText(txt).then(() => toast("تم نسخ النص"), () => toast("تعذّر النسخ")); return; }
  const del = t.closest("[data-del]");
  if (del && confirm("حذف هذه القصيدة نهائياً؟")) { poems = poems.filter(p => p.id !== del.dataset.del); save(); $("#reader").close(); render(); toast("تم الحذف"); return; }
  if (t.closest("#addRow")) { $("#mediaRows").insertAdjacentHTML("beforeend", mediaRow()); return; }
  const rm = t.closest("[data-rmrow]"); if (rm) { const rows = $("#mediaRows"); rm.parentElement.remove(); if (!rows.children.length) rows.insertAdjacentHTML("beforeend", mediaRow()); return; }
  if (t.closest(".nav a")) closeMenu();
});
document.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.classList?.contains("card")) { e.preventDefault(); openReader(e.target.dataset.id); }
});
document.addEventListener("change", e => {
  if (e.target.id === "personaSel") { state.persona = e.target.value; render(); }
});
document.addEventListener("submit", e => { if (e.target.id === "poemForm") { e.preventDefault(); submitForm(e.target); } });

let qT; $("#q").addEventListener("input", e => { clearTimeout(qT); qT = setTimeout(() => { state.q = e.target.value; render(); }, 150); });
$("#addBtn").onclick = () => openEditor();
$("#exportBtn").onclick = exportData;
$("#importBtn").onclick = () => $("#importFile").click();
$("#importFile").onchange = e => { const f = e.target.files[0]; if (f) f.text().then(importData); e.target.value = ""; };
$("#resetBtn").onclick = () => { if (confirm("استعادة البيانات من ملف data.js؟ ستُفقد التعديلات غير المصدّرة.")) { store.del(KEY); poems = seed(); render(); toast("تمت الاستعادة"); } };

const root = document.documentElement;
const savedTheme = store.get("majed-theme"); if (savedTheme) root.dataset.theme = savedTheme;
$("#themeBtn").onclick = () => {
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark"; store.set("majed-theme", root.dataset.theme);
};

const side = $("#side"), scrim = $("#scrim");
function closeMenu(){ side.classList.remove("open"); scrim.classList.remove("on"); }
$("#menuBtn").onclick = () => { side.classList.add("open"); scrim.classList.add("on"); };
scrim.onclick = closeMenu;

function route(){
  const v = location.hash.replace(/^#\/?/, "") || "home";
  state.view = ["home", "all", ...SECTIONS.map(s => s.id)].includes(v) ? v : "home";
  render(); window.scrollTo(0, 0);
}
addEventListener("hashchange", route);
route();
})();
</script>
</body>
</html>
