<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ديوان السيد محمد الماجد</title>
<meta name="description" content="ديوان خادم أهل البيت السيد محمد الماجد: مدح، رثاء، مناجاة، ومجالس كاملة.">
<style>
@font-face{font-family:"Thmanyah Serif Text";src:url("fonts/thmanyah-serif-text-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Thmanyah Serif Text";src:url("fonts/thmanyah-serif-text-Medium.woff2") format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Thmanyah Serif Text";src:url("fonts/thmanyah-serif-text-Bold.woff2") format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Thmanyah Serif Display";src:url("fonts/thmanyah-serif-display-Medium.woff2") format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Thmanyah Serif Display";src:url("fonts/thmanyah-serif-display-Bold.woff2") format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Thmanyah Serif Display";src:url("fonts/thmanyah-serif-display-Black.woff2") format("woff2");font-weight:900;font-display:swap}

:root{
  --bg:#FAF8F4; --ink:#1A1814; --ink-2:#6B655A; --ink-3:#A39C8E; --line:#E6E1D7; --accent:#8C6A2F;
  --serif:"Thmanyah Serif Text","Amiri","Noto Naskh Arabic",serif;
  --display:"Thmanyah Serif Display","Thmanyah Serif Text","Amiri",serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#121110;--ink:#ECE7DD;--ink-2:#A39C8E;--ink-3:#6B655A;--line:#2A2724;--accent:#C9A766;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#121110;--ink:#ECE7DD;--ink-2:#A39C8E;--ink-3:#6B655A;--line:#2A2724;--accent:#C9A766;color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--serif);font-size:18px;line-height:1.8;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
::selection{background:var(--accent);color:var(--bg)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.wrap{max-width:820px;margin:0 auto;padding:0 24px}

/* header */
header{padding:28px 0 0}
.bar{display:flex;align-items:center;gap:18px}
.name{font-family:var(--display);font-weight:700;font-size:19px;flex:1}
.icon{background:none;border:0;padding:4px;cursor:pointer;color:var(--ink-2);display:inline-flex;line-height:0}
.icon:hover{color:var(--ink)}
.more{position:relative}
.more-menu{position:absolute;inset-inline-end:0;top:calc(100% + 8px);background:var(--bg);border:1px solid var(--line);padding:6px 0;min-width:200px;z-index:20;display:none}
.more-menu.on{display:block}
.more-menu button{display:block;width:100%;text-align:start;background:none;border:0;padding:7px 16px;cursor:pointer;font-size:15px;color:var(--ink-2)}
.more-menu button:hover{color:var(--ink)}
nav{display:flex;gap:26px;margin-top:22px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{padding:0 0 12px;color:var(--ink-3);white-space:nowrap;font-size:16px;border-bottom:1px solid transparent;margin-bottom:-1px}
nav a:hover{color:var(--ink)}
nav a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ink)}
.search{display:none;margin-top:18px}
.search.on{display:block}
.search input{width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:8px 0;outline:none;font-size:20px}
.search input:focus{border-color:var(--ink)}

main{padding:0 0 100px}

/* home */
.hero{padding:clamp(70px,14vw,140px) 0 clamp(50px,9vw,90px);text-align:center}
.hero .pre{color:var(--accent);font-size:15px;letter-spacing:.02em}
.hero h1{font-family:var(--display);font-weight:900;font-size:clamp(46px,10vw,92px);line-height:1.15;margin:10px 0 18px}
.hero .count{color:var(--ink-3);font-size:16px}
.index{list-style:none;margin:0 0 80px;padding:0;border-top:1px solid var(--line)}
.index a{display:flex;align-items:baseline;gap:16px;padding:20px 0;border-bottom:1px solid var(--line)}
.index .t{font-family:var(--display);font-weight:500;font-size:clamp(22px,4vw,28px);flex:1;transition:color .15s}
.index .n{color:var(--ink-3);font-variant-numeric:tabular-nums;font-size:15px}
.index a:hover .t{color:var(--accent)}
.label{font-size:14px;color:var(--ink-3);margin:0 0 6px}

/* list */
.head{padding:56px 0 8px}
.head h2{font-family:var(--display);font-weight:900;font-size:clamp(36px,7vw,56px);line-height:1.2;margin:0}
.filters{display:flex;flex-direction:column;gap:6px;padding:20px 0 26px;font-size:15px}
.frow{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px}
.frow > span{color:var(--ink-3);min-width:64px}
.opt{background:none;border:0;padding:0;cursor:pointer;color:var(--ink-3)}
.opt:hover{color:var(--ink)}
.opt[aria-pressed="true"]{color:var(--ink);text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:1px}
.frow select{border:0;background:none;padding:0;color:var(--ink);cursor:pointer;max-width:100%}
.meta{color:var(--ink-3);font-size:14px;margin-bottom:6px}
.meta a,.meta button{background:none;border:0;padding:0;color:var(--ink-2);cursor:pointer;text-decoration:underline;text-underline-offset:4px}

.items{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.item{padding:26px 0;border-bottom:1px solid var(--line);cursor:pointer}
.item:focus-visible{outline:1px solid var(--ink);outline-offset:4px}
.item h3{font-family:var(--display);font-weight:700;font-size:clamp(22px,3.6vw,26px);line-height:1.4;margin:0 0 4px;transition:color .15s}
.item:hover h3{color:var(--accent)}
.item .ex{color:var(--ink-2);margin:0 0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .tags{color:var(--ink-3);font-size:14px}
.item .tags .m{color:var(--accent)}
.empty{padding:70px 0;text-align:center;color:var(--ink-3)}
.empty button{margin-top:12px}

/* dialogs */
dialog{border:0;padding:0;margin:0;max-width:none;max-height:none;width:100%;height:100%;background:var(--bg);color:var(--ink)}
dialog::backdrop{background:var(--bg)}
.sheet{height:100%;overflow:auto}
.sheet .wrap{max-width:720px;padding-top:28px;padding-bottom:90px}
.close{display:flex;justify-content:flex-start}
.reader-head{text-align:center;padding:50px 0 34px}
.reader-head .meta{margin-bottom:12px}
.reader-head h2{font-family:var(--display);font-weight:900;font-size:clamp(34px,6.5vw,54px);line-height:1.25;margin:0}
.reader-head .tags{color:var(--ink-3);font-size:15px;margin-top:14px}
.orn{text-align:center;color:var(--ink-3);letter-spacing:.6em;margin:0 0 34px}

.poem{font-size:clamp(19px,2.6vw,22px);line-height:2.2}
.poem .bayt{display:grid;grid-template-columns:1fr 1fr;gap:0 clamp(24px,6vw,64px);padding:3px 0}
.poem .bayt span{text-align:center}
.poem .line{text-align:center}
.poem .part{text-align:center;color:var(--accent);font-size:.8em;margin:34px 0 8px}
.poem .part:first-child{margin-top:0}
.notes{color:var(--ink-2);font-size:15px;text-align:center;margin:44px 0 0}
.media{margin-top:54px;display:flex;flex-direction:column;gap:26px}
.media .label{text-align:center}
.embed{position:relative;aspect-ratio:16/9;background:#000}
.embed iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.media audio,.media video{width:100%}
.media .ext{text-align:center}
.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:12px 28px;margin-top:70px;padding-top:22px;border-top:1px solid var(--line);font-size:15px}

.link{background:none;border:0;padding:0;cursor:pointer;color:var(--ink-2);text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:1px}
.link:hover{color:var(--ink)}
.link.danger{color:#A33A3A}
.btn{background:var(--ink);color:var(--bg);border:0;padding:10px 26px;cursor:pointer;font-size:16px}
.btn:hover{opacity:.85}

/* form */
.form{display:grid;grid-template-columns:1fr 1fr;gap:26px 28px;padding-top:30px}
.form h2{grid-column:1/-1;font-family:var(--display);font-weight:900;font-size:clamp(30px,5vw,42px);margin:20px 0 6px}
.full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:4px}
.field > label,.field > .lab{font-size:14px;color:var(--ink-3)}
.field input,.field select,.field textarea{border:0;border-bottom:1px solid var(--line);background:none;padding:6px 0;outline:none;width:100%;border-radius:0}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--ink)}
.field textarea{min-height:240px;line-height:2.1;resize:vertical;border:1px solid var(--line);padding:12px 14px}
.hint{font-size:13px;color:var(--ink-3)}
.picks{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:15px;padding:4px 0 6px}
.picks label{display:inline-flex;align-items:center;gap:6px;cursor:pointer;color:var(--ink-2)}
.picks label:has(input:checked){color:var(--ink)}
.picks input{accent-color:var(--ink);margin:0}
.mrows{display:flex;flex-direction:column;gap:10px}
.mrow{display:grid;grid-template-columns:90px 1fr 1fr 24px;gap:14px;align-items:end}
.mrow select,.mrow input{border:0;border-bottom:1px solid var(--line);background:none;padding:6px 0;outline:none;min-width:0}
.mrow button{background:none;border:0;cursor:pointer;color:var(--ink-3);font-size:20px;padding:0}
.form-actions{grid-column:1/-1;display:flex;align-items:center;gap:26px;margin-top:14px}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 18px;font-size:15px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:60}
.toast.on{opacity:1}

@media (max-width:600px){
  .wrap{padding:0 18px}
  nav{gap:20px}
  .form{grid-template-columns:1fr}
  .mrow{grid-template-columns:1fr 24px}
  .mrow select,.mrow input{grid-column:1}
  .mrow button{grid-column:2;grid-row:1}
  .poem .bayt{grid-template-columns:1fr;text-align:center;padding:6px 0}
}
</style>
</head>
<body>
<header class="wrap">
  <div class="bar">
    <a href="#/" class="name">السيد محمد الماجد</a>
    <button class="icon" id="searchBtn" aria-label="بحث"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
    <button class="icon" id="addBtn" aria-label="إضافة قصيدة"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="icon" id="themeBtn" aria-label="تبديل المظهر"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg></button>
    <div class="more">
      <button class="icon" id="moreBtn" aria-label="المزيد" aria-expanded="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg></button>
      <div class="more-menu" id="moreMenu">
        <button type="button" id="exportBtn">تصدير البيانات</button>
        <button type="button" id="importBtn">استيراد ملف</button>
        <button type="button" id="resetBtn">استعادة البيانات الأصلية</button>
      </div>
      <input type="file" id="importFile" accept=".json,.js,application/json,text/javascript" hidden>
    </div>
  </div>
  <div class="search" id="searchBox"><label><span class="sr">بحث</span><input type="search" id="q" placeholder="ابحث في العناوين والأبيات…"></label></div>
  <nav id="nav" aria-label="الأقسام"></nav>
</header>

<main class="wrap" id="view"></main>

<dialog id="reader"><div class="sheet" id="readerSheet"></div></dialog>
<dialog id="editor"><div class="sheet" id="editorSheet"></div></dialog>
<div class="toast" id="toast" role="status"></div>

<script src="data.js"></script>
<script>
(() => {
"use strict";

/* ===== taxonomy ===== */
const SECTIONS = [
  { id: "madh",    label: "أبيات مدح",    short: "مدح" },
  { id: "ritha",   label: "أبيات رثاء",   short: "رثاء" },
  { id: "munajat", label: "أبيات مناجاة", short: "مناجاة" },
  { id: "other",   label: "أخرى",         short: "أخرى" },
  { id: "majlis",  label: "مجالس كاملة",  short: "مجالس" }
];
const DIALECTS = [{ id: "fusha", label: "فصيح" }, { id: "shaabi", label: "شعبي" }];
const FORMS = [
  { id: "amudi", label: "عمودي" }, { id: "majarid", label: "مجاريد" }, { id: "faizi", label: "فايزي" },
  { id: "hur", label: "حر" }, { id: "other", label: "أخرى" }
];
const PERSONAS = [
  "الرسول الأعظم (ص)", "الإمام علي (ع)", "السيدة فاطمة الزهراء (ع)", "الإمام الحسن (ع)",
  "الإمام الحسين (ع)", "الإمام زين العابدين (ع)", "الإمام الباقر (ع)", "الإمام الصادق (ع)",
  "الإمام الكاظم (ع)", "الإمام الرضا (ع)", "الإمام الجواد (ع)", "الإمام الهادي (ع)",
  "الإمام العسكري (ع)", "الإمام المهدي (عج)", "أبو الفضل العباس (ع)", "السيدة زينب (ع)",
  "علي الأكبر (ع)", "القاسم بن الحسن (ع)", "السيدة رقية (ع)", "أم البنين (ع)",
  "مسلم بن عقيل (ع)", "عامة"
];
const label = (list, id) => (list.find(x => x.id === id) || {}).label || id || "";

/* ===== storage ===== */
const KEY = "majed-diwan-v1";
const store = {
  get(k){ try { return localStorage.getItem(k); } catch { return null; } },
  set(k,v){ try { localStorage.setItem(k,v); return true; } catch { return false; } },
  del(k){ try { localStorage.removeItem(k); } catch {} }
};
const seed = () => JSON.parse(JSON.stringify(window.POEMS_SEED || []));
let poems;
try { poems = JSON.parse(store.get(KEY)) || seed(); } catch { poems = seed(); }
const save = () => { if (!store.set(KEY, JSON.stringify(poems))) toast("تعذّر الحفظ في المتصفح — صدّر البيانات لحفظها"); };

/* ===== state ===== */
const state = { view: "home", q: "", dialect: "", form: "", persona: "", hasMedia: false };

/* ===== helpers ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const norm = s => String(s || "").replace(/[ً-ْـ]/g, "").replace(/[أإآ]/g, "ا").replace(/ة/g, "ه").replace(/ى/g, "ي").toLowerCase();
const mediaOf = p => (p.media || []).filter(m => m && m.url && m.url.trim());
const allPersonas = () => { const s = new Set(PERSONAS); poems.forEach(p => (p.persona || []).forEach(x => s.add(x))); return [...s]; };
const num = n => Number(n).toLocaleString("ar-EG");
const plural = n => n === 1 ? "قصيدة واحدة" : n === 2 ? "قصيدتان" : n >= 3 && n <= 10 ? num(n) + " قصائد" : num(n) + " قصيدة";
function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("on"), 2400);
}

/* ===== filtering ===== */
function filtered(){
  const q = norm(state.q.trim());
  return poems.filter(p => {
    if (state.view !== "home" && state.view !== "all" && p.section !== state.view) return false;
    if (state.dialect && p.dialect !== state.dialect) return false;
    if (state.form && p.form !== state.form) return false;
    if (state.persona && !(p.persona || []).includes(state.persona)) return false;
    if (state.hasMedia && !mediaOf(p).length) return false;
    if (q && !norm([p.title, p.verses, p.occasion, (p.persona||[]).join(" ")].join(" ")).includes(q)) return false;
    return true;
  });
}

/* ===== nav ===== */
function renderNav(){
  const item = (id, text) => `<a href="#/${id}" ${state.view === id ? 'aria-current="page"' : ""}>${text}</a>`;
  $("#nav").innerHTML = item("all", "الكل") + SECTIONS.map(s => item(s.id, s.short)).join("");
}

/* ===== views ===== */
function firstLine(p){
  const l = String(p.verses || "").split("\n").map(x => x.trim()).find(x => x && !/^—.*—$/.test(x)) || "";
  return esc(l.replace(/\s*\|\s*/, "  ·  "));
}
function tagLine(p){
  const bits = [...(p.persona || []), label(DIALECTS, p.dialect), label(FORMS, p.form)].filter(Boolean).map(esc);
  if (mediaOf(p).length) bits.push('<span class="m">إلقاء ▸</span>');
  return bits.join("  ·  ");
}
function item(p){
  return `<li class="item" tabindex="0" data-id="${esc(p.id)}">
    <h3>${esc(p.title)}</h3>
    <p class="ex">${firstLine(p)}</p>
    <div class="tags">${tagLine(p)}</div>
  </li>`;
}
function opts(name, list){
  return `<button class="opt" data-f="${name}" data-v="" aria-pressed="${!state[name]}">الكل</button>` +
    list.map(x => `<button class="opt" data-f="${name}" data-v="${esc(x.id)}" aria-pressed="${state[name] === x.id}">${esc(x.label)}</button>`).join("");
}
function listView(){
  const items = filtered();
  const used = new Set(poems.flatMap(p => p.persona || []));
  const personas = allPersonas().filter(x => used.has(x));
  const active = state.dialect || state.form || state.persona || state.hasMedia || state.q;
  const title = state.view === "home" ? "نتائج البحث" : state.view === "all" ? "كل القصائد" : label(SECTIONS, state.view);
  return `<div class="head"><h2>${esc(title)}</h2></div>
    <div class="filters">
      <div class="frow"><span>اللهجة</span>${opts("dialect", DIALECTS)}</div>
      <div class="frow"><span>النوع</span>${opts("form", FORMS)}</div>
      <div class="frow"><span>الشخصية</span><select id="personaSel" aria-label="الشخصية"><option value="">الكل</option>${personas.map(x => `<option ${state.persona === x ? "selected" : ""}>${esc(x)}</option>`).join("")}</select></div>
      <div class="frow"><span>الإلقاء</span><button class="opt" id="mediaOpt" aria-pressed="${state.hasMedia}">فيه تسجيل فقط</button></div>
    </div>
    <div class="meta">${plural(items.length)}${active ? ' — <button id="clearF">مسح التصفية</button>' : ""}</div>
    ${items.length ? `<ul class="items">${items.map(item).join("")}</ul>`
      : `<div class="empty">لا شيء هنا بعد.<br><button class="link" data-add>أضف قصيدة</button></div>`}`;
}
function homeView(){
  if (state.q) return listView();
  const recent = poems.slice(-5).reverse();
  return `<section class="hero">
      <div class="pre">خادم أهل البيت عليهم السلام</div>
      <h1>السيد محمد الماجد</h1>
      <div class="count">${plural(poems.length)}</div>
    </section>
    <ul class="index">
      ${SECTIONS.map(s => `<li><a href="#/${s.id}"><span class="t">${s.label}</span><span class="n">${num(poems.filter(p => p.section === s.id).length)}</span></a></li>`).join("")}
    </ul>
    ${recent.length ? `<p class="label">أُضيف مؤخراً</p><ul class="items">${recent.map(item).join("")}</ul>` : ""}`;
}
function render(){
  renderNav();
  const t = state.view === "home" ? "" : state.view === "all" ? "كل القصائد" : label(SECTIONS, state.view);
  document.title = (t ? t + " · " : "") + "ديوان السيد محمد الماجد";
  $("#view").innerHTML = state.view === "home" ? homeView() : listView();
}

/* ===== reader ===== */
function poemHTML(text){
  return String(text || "").split("\n").map(raw => {
    const l = raw.trim();
    if (!l) return "";
    if (/^—.*—$/.test(l)) return `<div class="part">${esc(l.replace(/^—\s*|\s*—$/g, ""))}</div>`;
    if (l.includes("|")) { const [a, ...b] = l.split("|"); return `<div class="bayt"><span>${esc(a.trim())}</span><span>${esc(b.join("|").trim())}</span></div>`; }
    return `<div class="line">${esc(l)}</div>`;
  }).join("");
}
function ytId(url){
  const m = String(url).match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/))([\w-]{11})/);
  return m ? m[1] : null;
}
function mediaHTML(m){
  const url = m.url.trim(), lab = esc(m.label || (m.type === "audio" ? "تسجيل صوتي" : "تسجيل مرئي"));
  const id = ytId(url);
  if (id) return `<div><p class="label">${lab}</p><div class="embed"><iframe src="https://www.youtube-nocookie.com/embed/${id}" title="${lab}" allow="accelerometer; encrypted-media; picture-in-picture" allowfullscreen loading="lazy"></iframe></div></div>`;
  if (/\.(mp3|m4a|ogg|wav|aac)(\?|$)/i.test(url)) return `<div><p class="label">${lab}</p><audio controls preload="none" src="${esc(url)}"></audio></div>`;
  if (/\.(mp4|webm)(\?|$)/i.test(url)) return `<div><p class="label">${lab}</p><video controls preload="none" src="${esc(url)}"></video></div>`;
  if (/^https?:\/\//i.test(url)) return `<div class="ext"><a class="link" href="${esc(url)}" target="_blank" rel="noopener">${lab} ↗</a></div>`;
  return "";
}
const closeBtn = '<div class="close"><button class="icon" data-close aria-label="إغلاق"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>';
function openReader(id){
  const p = poems.find(x => x.id === id); if (!p) return;
  const m = mediaOf(p);
  const meta = [label(SECTIONS, p.section), p.occasion, p.year].filter(Boolean).map(esc).join("  ·  ");
  $("#readerSheet").innerHTML = `<div class="wrap">${closeBtn}
    <div class="reader-head"><div class="meta">${meta}</div><h2>${esc(p.title)}</h2>
      <div class="tags">${[...(p.persona || []), label(DIALECTS, p.dialect), label(FORMS, p.form)].filter(Boolean).map(esc).join("  ·  ")}</div></div>
    <div class="orn">✦ ✦ ✦</div>
    <div class="poem">${poemHTML(p.verses)}</div>
    ${p.notes ? `<p class="notes">${esc(p.notes)}</p>` : ""}
    ${m.length ? `<div class="media">${m.map(mediaHTML).join("")}</div>` : ""}
    <div class="actions">
      <button class="link" data-pdf="${esc(p.id)}">تنزيل PDF</button>
      <button class="link" data-docx="${esc(p.id)}">تنزيل Word</button>
      <button class="link" data-edit="${esc(p.id)}">تعديل</button>
      <button class="link" data-copy="${esc(p.id)}">نسخ النص</button>
      <button class="link danger" data-del="${esc(p.id)}">حذف</button>
    </div></div>`;
  showDialog($("#reader"));
}

/* ===== editor ===== */
function mediaRow(m = { type: "video", url: "", label: "" }){
  return `<div class="mrow">
    <select name="mtype" aria-label="نوع التسجيل"><option value="video" ${m.type === "video" ? "selected" : ""}>مرئي</option><option value="audio" ${m.type === "audio" ? "selected" : ""}>صوتي</option></select>
    <input name="murl" type="url" dir="ltr" placeholder="https://…" value="${esc(m.url)}" aria-label="الرابط">
    <input name="mlabel" placeholder="وصف (اختياري)" value="${esc(m.label)}" aria-label="الوصف">
    <button type="button" data-rmrow aria-label="حذف الرابط">×</button>
  </div>`;
}
function openEditor(id){
  const p = poems.find(x => x.id === id) || {
    id: "", title: "", section: SECTIONS.some(s => s.id === state.view) ? state.view : "madh",
    dialect: "fusha", persona: [], form: "amudi", occasion: "", year: "", verses: "", media: [], notes: ""
  };
  const o = (list, v) => list.map(x => `<option value="${x.id}" ${x.id === v ? "selected" : ""}>${x.label}</option>`).join("");
  $("#editorSheet").innerHTML = `<div class="wrap">${closeBtn}
    <form class="form" id="poemForm" data-id="${esc(p.id)}">
      <h2>${p.id ? "تعديل قصيدة" : "قصيدة جديدة"}</h2>
      <div class="field full"><label for="f-title">العنوان</label><input id="f-title" name="title" required value="${esc(p.title)}"></div>
      <div class="field"><label for="f-section">القسم</label><select id="f-section" name="section">${o(SECTIONS, p.section)}</select></div>
      <div class="field"><label for="f-occ">المناسبة</label><input id="f-occ" name="occasion" value="${esc(p.occasion)}"></div>
      <div class="field"><label for="f-dialect">اللهجة</label><select id="f-dialect" name="dialect">${o(DIALECTS, p.dialect)}</select></div>
      <div class="field"><label for="f-form">النوع</label><select id="f-form" name="form">${o(FORMS, p.form)}</select></div>
      <div class="field full"><span class="lab">الشخصية</span>
        <div class="picks">${allPersonas().map(x => `<label><input type="checkbox" name="persona" value="${esc(x)}" ${(p.persona || []).includes(x) ? "checked" : ""}>${esc(x)}</label>`).join("")}</div>
        <input name="personaExtra" placeholder="شخصية أخرى؟ اكتبها هنا (افصل بفاصلة)" aria-label="شخصية أخرى">
      </div>
      <div class="field full"><label for="f-verses">الأبيات</label>
        <textarea id="f-verses" name="verses" required>${esc(p.verses)}</textarea>
        <span class="hint">كل بيت في سطر، والشطران يفصل بينهما |  —  ولعناوين أجزاء المجلس: — المقدمة —</span>
      </div>
      <div class="field full"><span class="lab">روابط الإلقاء</span>
        <div class="mrows" id="mediaRows">${(p.media && p.media.length ? p.media : [undefined]).map(mediaRow).join("")}</div>
        <div><button type="button" class="link" id="addRow" style="font-size:14px;margin-top:6px">رابط آخر</button></div>
      </div>
      <div class="field"><label for="f-year">السنة</label><input id="f-year" name="year" value="${esc(p.year)}"></div>
      <div class="field"><label for="f-notes">ملاحظات</label><input id="f-notes" name="notes" value="${esc(p.notes)}"></div>
      <div class="form-actions"><button class="btn" type="submit">حفظ</button><button class="link" type="button" data-close>إلغاء</button></div>
    </form></div>`;
  showDialog($("#editor"));
}
function submitForm(form){
  const fd = new FormData(form);
  const persona = [...fd.getAll("persona"), ...String(fd.get("personaExtra") || "").split(/[,،]/).map(s => s.trim()).filter(Boolean)];
  const types = fd.getAll("mtype"), urls = fd.getAll("murl"), labels = fd.getAll("mlabel");
  const media = urls.map((u, i) => ({ type: types[i], url: String(u).trim(), label: String(labels[i]).trim() })).filter(m => m.url);
  const data = {
    title: String(fd.get("title")).trim(), section: fd.get("section"), dialect: fd.get("dialect"), form: fd.get("form"),
    occasion: String(fd.get("occasion")).trim(), year: String(fd.get("year")).trim(), notes: String(fd.get("notes")).trim(),
    verses: String(fd.get("verses")).replace(/\r/g, "").trim(), persona: [...new Set(persona)], media
  };
  const id = form.dataset.id;
  if (id) Object.assign(poems.find(p => p.id === id), data);
  else poems.push({ id: "p" + Date.now().toString(36), ...data });
  save(); $("#editor").close(); render(); toast("تم الحفظ");
}

/* ===== dialogs ===== */
function showDialog(d){ d.showModal(); d.querySelector(".sheet").scrollTop = 0; }
document.querySelectorAll("dialog").forEach(d => d.addEventListener("click", e => { if (e.target.closest("[data-close]")) d.close(); }));

/* ===== import / export ===== */
let downloadsApi = null;
if (window.claude && typeof window.claude.use === "function") {
  window.claude.use("downloads").then(d => { downloadsApi = d; }).catch(() => {});
}
async function exportData(){
  if (downloadsApi) {
    try {
      await downloadsApi.save({ filename: "diwan-almajed.json", data: JSON.stringify(poems, null, 2) });
      toast("تم حفظ الملف — افتحه لاحقاً من «استيراد ملف»");
    } catch (e) { if (e && e.code !== "declined") toast("تعذّر حفظ الملف هنا"); }
    return;
  }
  const body = "/* بيانات ديوان السيد محمد الماجد — صُدّرت في " + new Date().toLocaleDateString("ar") + " */\nwindow.POEMS_SEED = " + JSON.stringify(poems, null, 2) + ";\n";
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([body], { type: "text/javascript" }));
  a.download = "data.js"; a.click(); URL.revokeObjectURL(a.href);
  toast("تم تنزيل data.js — استبدل به الملف في مجلد الموقع");
}
function importData(text){
  try {
    const arr = JSON.parse(text.slice(text.indexOf("["), text.lastIndexOf("]") + 1));
    if (!Array.isArray(arr)) throw 0;
    poems = arr; save(); render(); toast(`تم استيراد ${plural(arr.length)}`);
  } catch { toast("تعذّرت قراءة الملف — استخدم ملفاً صدّرته من الموقع"); }
}

/* ===== PDF / Word ===== */
const LIBS = {
  jspdf: "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js",
  h2i:   "https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js",
  docx:  "https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"
};
const loaded = {};
const loadScript = src => loaded[src] || (loaded[src] = new Promise((res, rej) => {
  const el = document.createElement("script"); el.src = src; el.onload = res;
  el.onerror = () => { delete loaded[src]; rej(new Error("load")); };
  document.head.appendChild(el);
}));
const POET = "السيد محمد الماجد";
const fileName = (p, ext) => (String(p.title || "قصيدة").replace(/[\\/:*?"<>|]+/g, "").trim().slice(0, 80) || "قصيدة") + "." + ext;
const metaText = p => [label(SECTIONS, p.section), p.occasion, ...(p.persona || []), label(DIALECTS, p.dialect), label(FORMS, p.form)].filter(Boolean).join("  ·  ");
const parseLines = text => String(text || "").split("\n").map(l => l.trim()).filter(Boolean).map(l =>
  /^—.*—$/.test(l) ? { k: "part", t: l.replace(/^—\s*|\s*—$/g, "") }
  : l.includes("|") ? { k: "bayt", a: l.split("|")[0].trim(), b: l.split("|").slice(1).join("|").trim() }
  : { k: "line", t: l });

async function saveBlob(blob, name){
  if (downloadsApi) {
    try { await downloadsApi.save({ filename: name, data: blob }); toast("تم التنزيل"); }
    catch (e) { if (e && e.code !== "declined") toast("تعذّر التنزيل هنا"); }
    return;
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name; a.style.display = "none";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

async function buildPdf(p){
  await Promise.all([loadScript(LIBS.jspdf), loadScript(LIBS.h2i)]);
  await document.fonts.ready;
  const W = 794, H = 1123, PX = 80, PT = 84, PB = 96;
  const host = document.createElement("div");
  host.style.cssText = "position:fixed;top:0;left:-20000px;pointer-events:none";
  document.body.appendChild(host);
  const pageCss = `width:${W}px;height:${H}px;background:#fff;color:#1A1814;direction:rtl;font-family:${getComputedStyle(document.body).fontFamily};position:relative;overflow:hidden;padding:${PT}px ${PX}px ${PB}px;box-sizing:border-box`;
  const pages = [];
  const newPage = () => {
    const pg = document.createElement("div"); pg.style.cssText = pageCss;
    const body = document.createElement("div"); pg.appendChild(body);
    const foot = document.createElement("div");
    foot.style.cssText = "position:absolute;bottom:44px;left:0;right:0;text-align:center;font-size:12px;color:#A39C8E";
    pg.appendChild(foot); host.appendChild(pg); pages.push({ pg, body, foot }); return body;
  };
  const room = H - PT - PB;
  let body = newPage();
  const add = html => {
    const el = document.createElement("div"); el.innerHTML = html; const node = el.firstElementChild;
    body.appendChild(node);
    if (body.scrollHeight > room && body.children.length > 1) { node.remove(); body = newPage(); body.appendChild(node); }
  };
  add(`<div style="text-align:center;padding-bottom:30px">
    <div style="font-size:14px;color:#8C6A2F">خادم أهل البيت عليهم السلام · ${esc(POET)}</div>
    <div style="font-family:var(--display);font-weight:900;font-size:40px;line-height:1.3;margin:12px 0 10px">${esc(p.title)}</div>
    <div style="font-size:13px;color:#8A8376">${esc(metaText(p))}</div>
    <div style="color:#B5AE9F;letter-spacing:.6em;margin-top:22px">✦ ✦ ✦</div></div>`);
  parseLines(p.verses).forEach(l => {
    if (l.k === "part") add(`<div style="text-align:center;color:#8C6A2F;font-size:16px;padding:22px 0 6px">${esc(l.t)}</div>`);
    else if (l.k === "bayt") add(`<div style="display:grid;grid-template-columns:1fr 1fr;gap:0 48px;font-size:19px;line-height:2.2"><span style="text-align:center">${esc(l.a)}</span><span style="text-align:center">${esc(l.b)}</span></div>`);
    else add(`<div style="text-align:center;font-size:19px;line-height:2.2">${esc(l.t)}</div>`);
  });
  if (p.notes) add(`<div style="text-align:center;font-size:13px;color:#6B655A;padding-top:28px">${esc(p.notes)}</div>`);
  const links = mediaOf(p);
  if (links.length) add(`<div style="text-align:center;font-size:12px;color:#6B655A;padding-top:22px;direction:ltr">${links.map(m => esc(m.url)).join("<br>")}</div>`);
  pages.forEach((x, i) => { x.foot.textContent = pages.length > 1 ? `${POET}  ·  ${num(i + 1)} / ${num(pages.length)}` : POET; });
  try {
    const pdf = new window.jspdf.jsPDF({ unit: "mm", format: "a4" });
    for (let i = 0; i < pages.length; i++) {
      const png = await window.htmlToImage.toPng(pages[i].pg, { pixelRatio: 2, backgroundColor: "#ffffff", width: W, height: H });
      if (i) pdf.addPage();
      pdf.addImage(png, "PNG", 0, 0, 210, 297, undefined, "FAST");
    }
    pdf.setProperties({ title: p.title, author: POET });
    return pdf.output("blob");
  } finally { host.remove(); }
}

async function buildDocx(p){
  await loadScript(LIBS.docx);
  const D = window.docx;
  const F = "Thmanyah Serif Text";
  const font = { ascii: F, cs: F, hAnsi: F, eastAsia: F };
  const run = (text, o = {}) => new D.TextRun({ text, font, rightToLeft: true, size: o.size || 28, sizeComplexScript: o.size || 28,
    bold: !!o.bold, boldComplexScript: !!o.bold, color: o.color });
  const para = (runs, o = {}) => new D.Paragraph({ children: [].concat(runs), bidirectional: true,
    alignment: o.align || D.AlignmentType.CENTER, spacing: { before: o.before || 0, after: o.after ?? 120, line: o.line || 360 } });
  const none = { style: D.BorderStyle.NONE, size: 0, color: "FFFFFF" };
  const borders = { top: none, bottom: none, left: none, right: none, insideHorizontal: none, insideVertical: none };
  const kids = [
    para(run("خادم أهل البيت عليهم السلام · " + POET, { size: 20, color: "8C6A2F" })),
    para(run(p.title, { size: 48, bold: true }), { after: 80 }),
    para(run(metaText(p), { size: 18, color: "8A8376" }), { after: 200 }),
    para(run("✦ ✦ ✦", { size: 20, color: "B5AE9F" }), { after: 360 })
  ];
  parseLines(p.verses).forEach(l => {
    if (l.k === "part") kids.push(para(run(l.t, { size: 24, color: "8C6A2F", bold: true }), { before: 240, after: 120 }));
    else if (l.k === "bayt") kids.push(new D.Table({
      visuallyRightToLeft: true, borders, width: { size: 100, type: D.WidthType.PERCENTAGE },
      rows: [new D.TableRow({ cantSplit: true, children: [l.a, l.b].map(t => new D.TableCell({
        borders, width: { size: 50, type: D.WidthType.PERCENTAGE },
        children: [para(run(t), { after: 60 })] })) })]
    }));
    else kids.push(para(run(l.t)));
  });
  if (p.notes) kids.push(para(run(p.notes, { size: 20, color: "6B655A" }), { before: 400 }));
  mediaOf(p).forEach(m => kids.push(new D.Paragraph({ alignment: D.AlignmentType.CENTER,
    children: [new D.ExternalHyperlink({ link: m.url, children: [new D.TextRun({ text: (m.label || "رابط الإلقاء") + ": " + m.url, style: "Hyperlink", size: 18, font })] })] })));
  const doc = new D.Document({
    creator: POET, title: p.title,
    sections: [{ properties: { page: { margin: { top: 1300, bottom: 1300, left: 1300, right: 1300 } } }, children: kids }]
  });
  return D.Packer.toBlob(doc);
}

let busy = false;
async function downloadPoem(id, kind){
  const p = poems.find(x => x.id === id); if (!p || busy) return;
  busy = true; toast(kind === "pdf" ? "جارٍ تجهيز ملف PDF…" : "جارٍ تجهيز ملف Word…");
  try {
    const blob = kind === "pdf" ? await buildPdf(p) : await buildDocx(p);
    await saveBlob(blob, fileName(p, kind));
  } catch (e) {
    console.error(e); toast("تعذّر تجهيز الملف — تأكد من الاتصال بالإنترنت");
  } finally { busy = false; }
}

/* ===== events ===== */
const menu = $("#moreMenu"), moreBtn = $("#moreBtn");
const setMenu = on => { menu.classList.toggle("on", on); moreBtn.setAttribute("aria-expanded", on); };
document.addEventListener("click", e => {
  const t = e.target;
  if (!t.closest(".more")) setMenu(false);
  const it = t.closest(".item"); if (it) return openReader(it.dataset.id);
  const o = t.closest(".opt[data-f]"); if (o) { state[o.dataset.f] = o.dataset.v; return render(); }
  if (t.closest("#mediaOpt")) { state.hasMedia = !state.hasMedia; return render(); }
  if (t.closest("#clearF")) { Object.assign(state, { dialect: "", form: "", persona: "", hasMedia: false, q: "" }); $("#q").value = ""; return render(); }
  if (t.closest("[data-add]")) return openEditor();
  const pdfB = t.closest("[data-pdf]"); if (pdfB) return downloadPoem(pdfB.dataset.pdf, "pdf");
  const docB = t.closest("[data-docx]"); if (docB) return downloadPoem(docB.dataset.docx, "docx");
  const ed = t.closest("[data-edit]"); if (ed) { $("#reader").close(); return openEditor(ed.dataset.edit); }
  const cp = t.closest("[data-copy]");
  if (cp) { const p = poems.find(x => x.id === cp.dataset.copy);
    const txt = p.title + "\n\n" + p.verses.replace(/\s*\|\s*/g, "    ") + "\n\n— السيد محمد الماجد";
    navigator.clipboard?.writeText(txt).then(() => toast("تم نسخ النص"), () => toast("تعذّر النسخ")); return; }
  const del = t.closest("[data-del]");
  if (del && confirm("حذف هذه القصيدة نهائياً؟")) { poems = poems.filter(p => p.id !== del.dataset.del); save(); $("#reader").close(); render(); toast("تم الحذف"); return; }
  if (t.closest("#addRow")) { $("#mediaRows").insertAdjacentHTML("beforeend", mediaRow()); return; }
  const rm = t.closest("[data-rmrow]"); if (rm) { const rows = $("#mediaRows"); rm.parentElement.remove(); if (!rows.children.length) rows.insertAdjacentHTML("beforeend", mediaRow()); }
});
document.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.classList?.contains("item")) { e.preventDefault(); openReader(e.target.dataset.id); }
  if (e.key === "Escape") setMenu(false);
});
document.addEventListener("change", e => { if (e.target.id === "personaSel") { state.persona = e.target.value; render(); } });
document.addEventListener("submit", e => { if (e.target.id === "poemForm") { e.preventDefault(); submitForm(e.target); } });

let qT; $("#q").addEventListener("input", e => { clearTimeout(qT); qT = setTimeout(() => { state.q = e.target.value; render(); }, 150); });
$("#searchBtn").onclick = () => { const b = $("#searchBox"); b.classList.toggle("on"); if (b.classList.contains("on")) $("#q").focus(); };
$("#addBtn").onclick = () => openEditor();
moreBtn.onclick = () => setMenu(!menu.classList.contains("on"));
$("#exportBtn").onclick = () => { setMenu(false); exportData(); };
$("#importBtn").onclick = () => { setMenu(false); $("#importFile").click(); };
$("#importFile").onchange = e => { const f = e.target.files[0]; if (f) f.text().then(importData); e.target.value = ""; };
$("#resetBtn").onclick = () => { setMenu(false); if (confirm("استعادة البيانات الأصلية؟ ستُفقد التعديلات غير المصدّرة.")) { store.del(KEY); poems = seed(); render(); toast("تمت الاستعادة"); } };

const root = document.documentElement;
const savedTheme = store.get("majed-theme"); if (savedTheme) root.dataset.theme = savedTheme;
$("#themeBtn").onclick = () => {
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark"; store.set("majed-theme", root.dataset.theme);
};

function route(){
  const v = location.hash.replace(/^#\/?/, "") || "home";
  state.view = ["home", "all", ...SECTIONS.map(s => s.id)].includes(v) ? v : "home";
  render(); window.scrollTo(0, 0);
}
addEventListener("hashchange", route);
route();
})();
</script>
</body>
