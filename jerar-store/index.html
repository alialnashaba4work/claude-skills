<script>/* شريط العرض تحت الفيديو: أحمر ويمشي */
(function(){const el=$('#offer');function paint(){const live=offerLive();el.hidden=!live;if(!live)return;
const item=`<span class="of-i"><b>${tx(OFFER.title)}</b><i></i><span>${tx(OFFER.codeTxt)}</span><i></i><span>${tx(OFFER.sub)}</span><i></i><u>${tx(OFFER.cta)}</u><i></i></span>`;
/* نكرر الكلام لين يغطي عرض الشاشة مرتين، عشان الحركة ما يبان لها نهاية */
const tr=$('#ofTrack');tr.innerHTML=`<span class="of-half">${item}</span>`;
const one=tr.firstChild.getBoundingClientRect().width||300;
const n=Math.max(2,Math.ceil((Math.max(innerWidth,screen.width||0)+200)/one));
const half=`<span class="of-half">${item.repeat(n)}</span>`;
tr.innerHTML=half+half;
tr.style.animationDuration=(one*n/45)+'s';$('#ofSr').textContent=`${tx(OFFER.title)}، ${tx(OFFER.sub)}`;
el.setAttribute('aria-label',`${tx(OFFER.title)}، ${tx(OFFER.cta)}`)}
document.addEventListener('localechange',paint);let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(paint,300)});paint()})();</script>
